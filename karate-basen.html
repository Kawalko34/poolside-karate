  ctx.beginPath(); ctx.moveTo(hx-3*s,hy-3.4*s); ctx.lineTo(hx+0.5*s,hy-1.6*s); ctx.moveTo(hx+1.5*s,hy-1.6*s); ctx.lineTo(hx+6*s,hy-3.4*s); ctx.stroke();
  // OKULARY przeciwsłoneczne (chronią przed gazem)
  if(f.glasses){
    ctx.fillStyle='rgba(15,20,30,0.94)'; ctx.strokeStyle='#000'; ctx.lineWidth=1.3*s;
    ctx.beginPath(); ctx.ellipse(hx-1*s,hy-1*s,3*s,2.5*s,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(hx+4.5*s,hy-1*s,3*s,2.5*s,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.lineWidth=1.4*s; ctx.beginPath(); ctx.moveTo(hx+1.6*s,hy-1.3*s); ctx.lineTo(hx+2*s,hy-1.3*s); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1*s; ctx.beginPath(); ctx.moveTo(hx-2.4*s,hy-2*s); ctx.lineTo(hx-0.6*s,hy-2.2*s); ctx.stroke();
  }
}

function drawStick(f){
  const s = f.scale;
  ctx.save();
  if(f===player && f.invuln > 0 && Math.floor(time*24)%2===0) ctx.globalAlpha = 0.45;
  // cień na ziemi (mniejszy, gdy postać wysoko w skoku)
  if(!f.pooled && !f.pooledSunk && !f.ghost){
    const air = Math.max(0, GROUND - f.y);
    const sc = Math.max(0.35, 1 - air/240);
    ctx.save();
    ctx.globalAlpha *= 0.28;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(f.x, GROUND+2, 22*s*sc, 6*s*sc, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.translate(f.x, f.y);
  if(f.rot) ctx.rotate(f.rot);
  if(f.pose==='ko' && !f.carried && state!=='lose'){ ctx.rotate(-Math.PI/2); ctx.translate(0, -8*s); }
  if(f.pose==='ko' && state==='lose' && f===player && cut && ['walk'].includes(cut.phase)){ ctx.rotate(-Math.PI/2); ctx.translate(0,-8*s); }
  // płynny obrót: postać „przekręca się" przez profil zamiast skakać w lustrze
  let fx0 = (f.faceX === undefined) ? f.facing : f.faceX;
  // kopnięcie z obrotu: sylwetka spłaszcza się i przekręca — czytelny obrót o 360°
  if(f.pose === 'spin'){
    const sp2 = Math.cos(Math.min(1, f.poseT/0.42) * Math.PI*2);
    fx0 *= (Math.abs(sp2) < 0.16 ? 0.16 : sp2);
  }
  ctx.scale(Math.abs(fx0) < 0.14 ? 0.14 * (fx0 < 0 ? -1 : 1) : fx0, 1);
  if(f.squash) ctx.scale(1 + f.squash*0.9, 1 - f.squash); // squash & stretch (środek w stopach)
  // linie pędu przy szybkim biegu
  if(f===player && (Math.abs(f.moveVx)>2.6 || Math.abs(f.vx)>2.5) && f.onGround && state==='fight'){
    ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2; ctx.lineCap='round';
    for(let i=0;i<3;i++){
      const ly=-(18+i*17)*s;
      ctx.beginPath(); ctx.moveTo(-16*s, ly); ctx.lineTo(-16*s-8-Math.abs(f.vx)*3.4, ly); ctx.stroke();
    }
  }
  const lw = 4.5*s;
  ctx.lineWidth = lw; ctx.lineCap='round';
  ctx.strokeStyle = f.hurtT>0 && Math.floor(time*20)%2===0 ? '#ff5252' : f.color;
  ctx.fillStyle = ctx.strokeStyle;

  const hip = {x:0, y:-38*s};
  const sh  = {x:0, y:-64*s};
  const headY = -78*s, headR = 9.5*s;

  // pozy
  const t = f.poseT;
  const breathe = Math.sin(time*3 + f.x*0.013);
  let armF={a:0.75+breathe*0.06,b:2.2}, armB={a:0.45+breathe*0.04,b:2.0}; // garda bokserska
  let legF={a:0.3,b:0.15}, legB={a:-0.3,b:0.15};
  let lean = 0, bob = breathe*1.3, atkK = 0;
  if(f.pose==='walk'){
    // chód przechodzi w bieg: dłuższy krok, mocniejszy wymach rąk, pochylenie do przodu
    const spd = Math.min(1, Math.abs(f.moveVx || f.vx) / 3.1);
    const sw = Math.sin(f.walkT), co = Math.cos(f.walkT);
    bob = Math.abs(co) * (2.1 + 2.6*spd);
    lean = 0.13 * spd;
    const stride = 0.5 + 0.42*spd;
    legF = {a: stride*sw,  b: 0.3 + 0.55*Math.max(0,  sw)};  // kolano zgina się w wymachu
    legB = {a: -stride*sw, b: 0.3 + 0.55*Math.max(0, -sw)};
    armF = {a: -(0.42 + 0.34*spd)*sw + 0.32, b: 1.55 - 0.45*spd};
    armB = {a:  (0.42 + 0.34*spd)*sw - 0.32, b: 1.55 - 0.45*spd};
  }
  if(f.pose==='punch'){ const k = t<0.1 ? t/0.1 : Math.max(0,1-(t-0.1)/0.14);
    armF={ext:k}; armB={a:0.5,b:2.3}; lean = 0.1*k; bob = 0; atkK = k;
    legF={a:0.45*k,b:0.2}; legB={a:-0.35*k,b:0.2}; }
  if(f.pose==='kick'){ const k = t<0.13 ? t/0.13 : Math.max(0,1-(t-0.13)/0.18);
    legF={ext:k}; armF={a:1.1,b:0.6}; armB={a:-1.3,b:0.6}; lean = -0.22*k; bob = 0; atkK = k; }
  if(f.pose==='hit'){ armF={a:1.5,b:0.5}; armB={a:1.3,b:0.5}; lean = -0.25; }
  if(f.pose==='block'){ // przedramiona skrzyżowane przed sobą
    armF={a:0.35,b:2.75}; armB={a:0.15,b:2.5}; lean = 0.07; bob = 0; }
  if(f.pose==='kneel'){ // oświadczyny — przyklęk, pierścionek w wyciągniętej ręce
    bob = -13; lean = 0.1;
    legF={a:0.85,b:1.5}; legB={a:-0.15,b:1.35};
    armF={ext:0.75}; armB={a:0.35,b:1.9}; }
  if(f.pose==='slam'){ // obie ręce nad głową, nogi podkulone w locie
    armF={a:2.7,b:2.9}; armB={a:2.5,b:2.8};
    if(!f.onGround){ legF={a:0.9,b:1.1}; legB={a:0.5,b:1.0}; }
    lean = 0.12; bob = 0; }
  if(f.pose==='shoot'){ // wyciągnięty blaster + odrzut
    const rk = Math.max(0, 1-t/0.18);
    armF={ext:0.92 - rk*0.12}; armB={a:0.55,b:2.1}; lean = -0.05 - rk*0.05; bob = 0;
    legF={a:0.28,b:0.2}; legB={a:-0.3,b:0.2}; }
  if(f.pose==='spray'){ // puszka gazu wyciągnięta przed siebie + lekki odrzut
    const rk = Math.max(0, 1-t/0.2);
    armF={ext:0.8 - rk*0.1}; armB={a:0.9,b:2.0}; lean = -0.04 - rk*0.05; bob = 0;
    legF={a:0.3,b:0.2}; legB={a:-0.28,b:0.2}; }
  if(f.pose==='cough'){ // zagazowany: dłonie przy twarzy, kuli się i słania
    const w = Math.sin(f.walkT)*0.3;
    armF={a:2.45+w,b:2.75}; armB={a:2.2-w,b:2.6};
    lean = -0.16; bob = Math.abs(Math.sin(f.walkT))*2.2;
    legF={a:0.2,b:0.3}; legB={a:-0.2,b:0.3}; }
  if(f.pose==='charge'){ // baran pędzi z pochylonym łbem — ręce do tyłu
    const rn = Math.sin(f.walkT);
    lean = 0.5; bob = Math.abs(Math.cos(f.walkT))*2.4;
    armF={a:-0.35,b:1.1}; armB={a:0.45,b:1.15};
    legF={a:0.85*rn,b:0.45}; legB={a:-0.85*rn,b:0.45}; }
  if(f.pose==='upper'){ // podbródkowy — całe ciało wystrzela w górę za pięścią
    const k = t<0.12 ? t/0.12 : Math.max(0, 1-(t-0.12)/0.2);
    armF={a:2.9*k + 0.75*(1-k), b:2.95*k + 2.2*(1-k)}; armB={a:0.2,b:1.9};
    legF={a:0.55*k,b:0.9*k}; legB={a:-0.35*k,b:0.5*k};
    lean = -0.3*k; bob = -10*k; atkK = k; }
  if(f.pose==='spin'){ // kopnięcie z obrotu — noga wyprostowana w poziomie
    const k = Math.min(1, t/0.14);
    legF={ext:1}; armF={a:1.35,b:0.35}; armB={a:-1.5,b:0.35};
    lean = -0.12; bob = -3; atkK = Math.max(0, 1-(t-0.1)/0.3); }
  if(f.pose==='sweep'){ // podcięcie — głęboki przysiad, noga nisko przy deskach
    const k = t<0.1 ? t/0.1 : Math.max(0, 1-(t-0.1)/0.26);
    bob = -22*k; lean = 0.3*k;
    legF={a:-0.95*k, b:-0.75*k}; legB={a:0.75*k, b:1.5};
    armF={a:0.1,b:1.1}; armB={a:1.4,b:2.4}; atkK = k*0.8; }
  if(f.pose==='fly'){ // kopniak z wyskoku — obie nogi do przodu, ręce w tył
    legF={ext:1}; legB={a:0.5,b:1.0};
    armF={a:1.6,b:2.6}; armB={a:2.0,b:2.7};
    lean = -0.32; bob = 0; atkK = 0.9; }
  if(f.pose==='ready'){ // zapowiedź techniki — skulony, gotowy do wyskoku
    const pu = 0.5 + 0.5*Math.sin(time*22);
    bob = -4 - 3*pu; lean = 0.16;
    legF={a:0.75,b:1.35}; legB={a:-0.5,b:1.25};
    armF={a:0.95,b:2.6}; armB={a:0.8,b:2.5}; }
  if(f.pose==='slamRun'){ // szarża barkiem — głowa nisko, ręce w tył
    const sw = Math.sin(f.walkT*1.6);
    lean = 0.42; bob = Math.abs(Math.cos(f.walkT))*2;
    legF={a:0.75*sw,b:0.55}; legB={a:-0.75*sw,b:0.55};
    armF={a:2.3,b:2.7}; armB={a:2.5,b:2.8}; }
  if(f.pose==='zap'){ // porażenie prądem — ciało sztywne, ręce na boki, dygot
    const j = Math.sin(time*55)*0.3;
    armF={a:1.95+j,b:2.75}; armB={a:1.75-j,b:2.55};
    legF={a:0.12,b:0.08}; legB={a:-0.12,b:0.08};
    lean = j*0.12; bob = Math.sin(time*70)*2.2; }
  if(lean) ctx.rotate(lean);
  if(bob) ctx.translate(0, -bob);

  // ===== renderowanie ciała (wypełnione sylwetki) =====
  const gi = (f===player || f.isGreg);
  const froz = f.frozen > 0;
  const hurtFlash = f.hurtT>0 && Math.floor(time*20)%2===0;
  const zapFlash = f.pose==='zap' && Math.floor(time*26)%2===0;
  const bodyCol  = hurtFlash ? '#ff6b6b' : (froz ? '#8fd8ff' : (zapFlash ? '#fff8c4' : f.color));
  const limbCol  = gi ? (hurtFlash?'#ffc4c4':(zapFlash?'#fffbe0':'#e9e9e9')) : bodyCol;
  const skin = '#ffcfa0';
  ctx.lineCap='round'; ctx.lineJoin='round';

  function twoSeg(px,py,a1,l1,a2,l2,w){
    const ex=px+Math.cos(a1)*l1, ey=py+Math.sin(a1)*l1;
    const hx=ex+Math.cos(a2)*l2, hy=ey+Math.sin(a2)*l2;
    const base=ctx.strokeStyle;
    ctx.lineCap='round'; ctx.lineJoin='round';
    // baza kończyny
    ctx.lineWidth=w; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(ex,ey); ctx.lineTo(hx,hy); ctx.stroke();
    // cień po dolno-prawej (walec)
    ctx.strokeStyle='rgba(0,0,0,0.20)'; ctx.lineWidth=w*0.5;
    ctx.beginPath(); ctx.moveTo(px+0.2*w,py+0.24*w); ctx.lineTo(ex+0.2*w,ey+0.24*w); ctx.lineTo(hx+0.2*w,hy+0.24*w); ctx.stroke();
    // rozświetlenie po górno-lewej
    ctx.strokeStyle='rgba(255,255,255,0.3)'; ctx.lineWidth=w*0.3;
    ctx.beginPath(); ctx.moveTo(px-0.24*w,py-0.26*w); ctx.lineTo(ex-0.24*w,ey-0.26*w); ctx.lineTo(hx-0.24*w,hy-0.26*w); ctx.stroke();
    ctx.strokeStyle=base;
    // staw (łokieć/kolano) z delikatnym podświetleniem
    ctx.beginPath(); ctx.arc(ex,ey,w*0.54,0,Math.PI*2); ctx.fillStyle=base; ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.beginPath(); ctx.arc(ex-w*0.18,ey-w*0.2,w*0.24,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=base;
    return {hx,hy};
  }
  const aL=15*s, lL=20*s;
  const armW=(f.isArek?8:6.2)*s, legW=(f.isArek?9.2:7)*s;
  const shW=(f.isArek?14:11.5)*s, hipW=(f.isArek?10.5:8.2)*s;

  if(!gi){ drawSheep(f, s, sh, hip, headY, headR, legF, legB, hurtFlash, limbCol); }
  else {
  // --- NOGI (za tułowiem) ---
  ctx.strokeStyle = limbCol;
  let footF, footB;
  if(legF.ext!==undefined){ const e=legF.ext; footF=twoSeg(hip.x,hip.y,-0.55*e,lL,-0.3*e,lL,legW); }
  else footF=twoSeg(hip.x,hip.y,1.57-legF.a,lL,1.57-legF.b*0.5,lL,legW);
  footB=twoSeg(hip.x,hip.y,1.57-legB.a,lL,1.57-legB.b*0.5,lL,legW);
  ctx.fillStyle = gi ? '#3a3a3a' : '#000';
  [footB,footF].forEach(ft=>{ if(ft){ ctx.save(); ctx.translate(ft.hx,ft.hy); ctx.beginPath(); ctx.ellipse(3*s,1*s,6*s,3.4*s,0,0,Math.PI*2); ctx.fill(); ctx.restore(); } });

  // --- TUŁÓW (wypełniony, barki szersze niż biodra) ---
  if(f.cheer && !hurtFlash && !zapFlash){
    const topG=ctx.createLinearGradient(0, sh.y-4*s, 0, hip.y+5*s);
    topG.addColorStop(0,'#4a90e8'); topG.addColorStop(0.55,'#2f74d8'); topG.addColorStop(1,'#1f57ad');
    ctx.fillStyle=topG;
  } else {
    ctx.fillStyle = f.cheer ? (hurtFlash?'#ff8aa0':(zapFlash?'#bfe4ff':'#2f74d8'))
                  : gi ? (hurtFlash?'#ffd6d6':(zapFlash?'#fffbe0':'#f7f7f7')) : bodyCol;
  }
  ctx.beginPath();
  ctx.moveTo(-hipW, hip.y);
  ctx.lineTo(-shW, sh.y+3*s);
  ctx.quadraticCurveTo(0, sh.y-4*s, shW, sh.y+3*s);
  ctx.lineTo(hipW, hip.y);
  ctx.quadraticCurveTo(0, hip.y+5*s, -hipW, hip.y);
  ctx.closePath();
  ctx.fill();
  // WEŁNA barana — kremowe kłęby na tułowiu (tylko wrogowie)
  if(!gi){
    const woolCol = hurtFlash ? '#ffe0e0' : (f.isArek ? '#3b3530' : '#efe7d2');
    const woolSh  = f.isArek ? 'rgba(0,0,0,0.3)' : 'rgba(120,110,85,0.28)';
    const cT = sh.y+4*s, cB = hip.y+2*s, cM = (cT+cB)/2;
    const bumps = [[-shW*0.68,cT,5],[0,sh.y-1*s,6],[shW*0.68,cT,5],
                   [-hipW*0.85,cM,5.6],[hipW*0.85,cM,5.6],
                   [-hipW*0.45,cB,5],[hipW*0.45,cB,5],[0,cB+1.5*s,5.6]];
    ctx.fillStyle=woolSh; for(const b of bumps){ ctx.beginPath(); ctx.arc(b[0]+1*s,b[1]+1.6*s,b[2]*s,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle=woolCol; for(const b of bumps){ ctx.beginPath(); ctx.arc(b[0],b[1],b[2]*s,0,Math.PI*2); ctx.fill(); }
    ctx.fillStyle='rgba(255,255,255,0.35)'; for(const b of bumps){ ctx.beginPath(); ctx.arc(b[0]-b[2]*0.35*s,b[1]-b[2]*0.4*s,b[2]*0.35*s,0,Math.PI*2); ctx.fill(); }
  }
  // cieniowanie tułowia + rozcięcie gi (klip do sylwetki)
  ctx.save(); ctx.clip();
  ctx.fillStyle='rgba(0,0,0,0.16)'; ctx.fillRect(2*s, sh.y-8*s, shW+6*s, 46*s);
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fillRect(-shW-6*s, sh.y-8*s, 6*s, 46*s);
  if(f.cheer){
    // top cheerleaderki: biały szewron „V" + lamówki rękawów + złota lamówka talii
    ctx.fillStyle='#fff';
    // górny biały szewron (grubszy)
    ctx.beginPath(); ctx.moveTo(-shW*0.82, sh.y+1*s); ctx.lineTo(0, sh.y+12*s); ctx.lineTo(shW*0.82, sh.y+1*s);
    ctx.lineTo(shW*0.55, sh.y+1*s); ctx.lineTo(0, sh.y+8*s); ctx.lineTo(-shW*0.55, sh.y+1*s); ctx.closePath(); ctx.fill();
    // drugi, cieńszy szewron (akcent)
    ctx.fillStyle='#ffd43b';
    ctx.beginPath(); ctx.moveTo(-shW*0.6, sh.y+9*s); ctx.lineTo(0, sh.y+15*s); ctx.lineTo(shW*0.6, sh.y+9*s);
    ctx.lineTo(shW*0.44, sh.y+9*s); ctx.lineTo(0, sh.y+12.5*s); ctx.lineTo(-shW*0.44, sh.y+9*s); ctx.closePath(); ctx.fill();
    // biała lamówka przy ramionach
    ctx.strokeStyle='#fff'; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.moveTo(-shW,sh.y+3*s); ctx.lineTo(-shW*0.6,sh.y+5*s);
    ctx.moveTo(shW,sh.y+3*s); ctx.lineTo(shW*0.6,sh.y+5*s); ctx.stroke();
    // złota lamówka talii
    ctx.fillStyle='#ffd43b'; ctx.fillRect(-hipW-1*s, hip.y-6*s, (hipW+1*s)*2, 3*s);
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(-hipW-1*s, hip.y-6*s, (hipW+1*s)*2, 1*s);
  } else if(gi){ ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=1.6*s;
    ctx.beginPath(); ctx.moveTo(1*s,sh.y-2*s); ctx.lineTo(-3*s,hip.y+4*s); ctx.stroke(); }
  ctx.restore();
  // rim light na krawędzi tułowia (lewa krawędź od słońca)
  ctx.strokeStyle = gi ? 'rgba(255,240,200,0.5)' : (f.isArek ? 'rgba(255,90,90,0.55)' : 'rgba(120,200,255,0.45)');
  ctx.lineWidth = 2*s; ctx.beginPath();
  ctx.moveTo(-hipW+1*s, hip.y); ctx.lineTo(-shW+1*s, sh.y+3*s);
  ctx.quadraticCurveTo(0, sh.y-3*s, shW*0.2, sh.y-3.5*s); ctx.stroke();

  // --- PAS / SPÓDNICZKA ---
  if(f.cheer){
    // plisowana spódniczka cheerleaderki — gęste plisy z cieniowaniem fałd
    const sw0 = hipW*1.8, sy = hip.y-1*s, slen = 22*s, pl = 10;
    for(let i=0;i<pl;i++){
      const x0 = -sw0 + (i/pl)*sw0*2, x1 = -sw0 + ((i+1)/pl)*sw0*2;
      const base = i%2 ? '#2f74d8' : '#eaf2ff';
      ctx.beginPath(); ctx.moveTo(x0, sy); ctx.lineTo(x1, sy);
      ctx.lineTo(x1*1.14, sy+slen); ctx.lineTo(x0*1.14, sy+slen); ctx.closePath();
      ctx.fillStyle = base; ctx.fill();
      // cień fałdy po prawej krawędzi plisy
      ctx.fillStyle='rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.moveTo(x1-1.2*s, sy); ctx.lineTo(x1, sy); ctx.lineTo(x1*1.14, sy+slen); ctx.lineTo(x1*1.14-1.4*s, sy+slen); ctx.closePath(); ctx.fill();
    }
    // dolna lamówka + cień
    ctx.fillStyle='#1b3a8f'; ctx.fillRect(-sw0*1.14, sy+slen-2.5*s, sw0*2*1.14, 2.5*s);
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-sw0*1.14, sy+slen, sw0*2*1.14, 1.5*s);
    // pasek w talii
    ctx.fillStyle='#ffd43b'; ctx.fillRect(-sw0, sy-1.5*s, sw0*2, 3*s);
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(-sw0, sy-1.5*s, sw0*2, 1*s);
  } else if(f.beltColor){
    ctx.fillStyle=f.beltColor;
    ctx.fillRect(-hipW-1.5*s, hip.y-3.5*s, (hipW+1.5*s)*2, 6*s);
    ctx.fillRect(-2.5*s, hip.y-2*s, 5*s, 12*s); // węzeł
    ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(-hipW-1.5*s, hip.y+1.5*s, (hipW+1.5*s)*2, 1.2*s);
  }

  // --- RĘKA TYLNA (za głową) ---
  ctx.strokeStyle = limbCol;
  const handB = twoSeg(sh.x,sh.y,1.57-armB.a,aL,1.57-armB.b,aL,armW);
  ctx.fillStyle = gi ? skin : (f.isArek?'#2a0000':'#1a1a1a');
  ctx.beginPath(); ctx.arc(handB.hx,handB.hy,(f.isArek?5.5:4.4)*s,0,Math.PI*2); ctx.fill();
  if(f.cheer) drawPompom(handB.hx, handB.hy, s, time + f.x*0.03);

  // --- GŁOWA ---
  if(gi && !zapFlash){
    // cera z gradientem (ciepłe światło u góry, cień przy żuchwie)
    const sg=ctx.createRadialGradient(-headR*0.35, headY-headR*0.45, headR*0.15, 0, headY+headR*0.3, headR*1.25);
    sg.addColorStop(0,'#ffe0bd'); sg.addColorStop(0.55, skin); sg.addColorStop(1,'#d79a6e');
    ctx.fillStyle=sg;
  } else ctx.fillStyle = gi ? (zapFlash ? '#fff3b0' : skin) : bodyCol;
  ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI*2); ctx.fill();
  // miękkie rozjaśnienie od słońca (lewa-góra)
  const hl = ctx.createRadialGradient(-headR*0.4, headY-headR*0.4, 0, -headR*0.4, headY-headR*0.4, headR*1.3);
  hl.addColorStop(0,'rgba(255,255,255,0.28)'); hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=hl; ctx.beginPath(); ctx.arc(0, headY, headR, 0, Math.PI*2); ctx.fill();
  // rim light — świetlisty kontur (nowoczesna głębia)
  ctx.strokeStyle = gi ? 'rgba(255,240,200,0.55)' : (f.isArek ? 'rgba(255,90,90,0.6)' : 'rgba(120,200,255,0.5)');
  ctx.lineWidth = 2*s;
  ctx.beginPath(); ctx.arc(0, headY, headR-0.5*s, Math.PI*0.75, Math.PI*1.75); ctx.stroke();

  if(gi){
    // CIEMNE WŁOSY — czapa na górze głowy + objętość z tyłu + grzywka
    ctx.fillStyle = hurtFlash ? '#5a4a42' : '#241e1b';
    ctx.beginPath(); ctx.arc(0, headY, headR+0.6*s, Math.PI*0.96, Math.PI*2.04); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-headR*0.55, headY-1*s, headR*0.5, headR*0.85, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-headR*0.9, headY-1*s);
    ctx.quadraticCurveTo(-1*s, headY-headR-1.5*s, headR*0.6, headY-2.5*s);
    ctx.quadraticCurveTo(0, headY+0.5*s, -headR*0.9, headY-1*s); ctx.fill();
    // BRODA — ciemny zarost wokół żuchwy
    ctx.beginPath();
    ctx.arc(0, headY, headR+0.4*s, 0.12*Math.PI, 0.88*Math.PI);
    ctx.arc(0, headY+2.5*s, headR*0.55, 0.88*Math.PI, 0.12*Math.PI, true);
    ctx.closePath(); ctx.fill();
    // baki łączące włosy z brodą
    ctx.fillRect(-headR*0.95, headY-1*s, 2*s, headR*0.9);
    ctx.save(); ctx.scale(-1,1); ctx.fillRect(-headR*0.95-2*s, headY-1*s, 2*s, headR*0.9); ctx.restore();
    // cień przy żuchwie (modelunek twarzy)
    ctx.fillStyle='rgba(150,90,55,0.18)';
    ctx.beginPath(); ctx.ellipse(5.5*s, headY+5*s, headR*0.55, headR*0.4, 0, 0, Math.PI); ctx.fill();
    // OCZY realistyczne — białko + tęczówka + źrenica + błysk
    function eye(cx){
      ctx.fillStyle='#f6f1ea'; ctx.beginPath(); ctx.ellipse(cx, headY, 2.3*s, 1.9*s, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='rgba(120,80,60,0.25)'; ctx.beginPath(); ctx.ellipse(cx, headY-0.8*s, 2.3*s, 1*s, 0, Math.PI, Math.PI*2); ctx.fill(); // cień powieki
      ctx.fillStyle='#6b4a2a'; ctx.beginPath(); ctx.arc(cx+0.4*s, headY+0.2*s, 1.25*s, 0, Math.PI*2); ctx.fill(); // tęczówka
      ctx.fillStyle='#1a1008'; ctx.beginPath(); ctx.arc(cx+0.4*s, headY+0.2*s, 0.6*s, 0, Math.PI*2); ctx.fill(); // źrenica
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx-0.1*s, headY-0.4*s, 0.5*s, 0, Math.PI*2); ctx.fill(); // błysk
      ctx.strokeStyle='rgba(40,30,25,0.6)'; ctx.lineWidth=0.7*s; // kreska powieki
      ctx.beginPath(); ctx.ellipse(cx, headY, 2.3*s, 1.9*s, 0, Math.PI*1.05, Math.PI*1.95); ctx.stroke();
    }
    eye(3.2*s); eye(8.2*s);
    // brwi (gęstsze)
    ctx.strokeStyle=hurtFlash?'#5a4a42':'#241e1b'; ctx.lineWidth=1.7*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(1.4*s,headY-3*s); ctx.quadraticCurveTo(3.2*s,headY-3.8*s,5*s,headY-3.1*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6.4*s,headY-3.1*s); ctx.quadraticCurveTo(8.2*s,headY-3.8*s,10*s,headY-3*s); ctx.stroke();
    // nos z cieniem
    ctx.strokeStyle='rgba(150,90,55,0.5)'; ctx.lineWidth=1.1*s;
    ctx.beginPath(); ctx.moveTo(6*s,headY+0.5*s); ctx.quadraticCurveTo(7.2*s,headY+2.2*s,6*s,headY+2.8*s); ctx.stroke();
    // usta
    ctx.strokeStyle='#8a4a3a'; ctx.lineWidth=1.3*s;
    if(f.cheer){ ctx.beginPath(); ctx.arc(5.5*s, headY+4.5*s, 2.4*s, 0.12*Math.PI, 0.88*Math.PI); ctx.stroke(); }
    else { ctx.beginPath(); ctx.moveTo(3.5*s,headY+5*s); ctx.quadraticCurveTo(6*s,headY+5.6*s,8.5*s,headY+5*s); ctx.stroke(); }
    if(f.cheer){
      // KOKARDKA cheerleaderki na czubku głowy
      const bx = -1*s, by = headY - headR - 1.5*s, bob2 = Math.sin(time*6+f.x*0.02)*0.12;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(bob2);
      ctx.fillStyle = hurtFlash?'#ff8aa0':'#ff3d7f';
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(-9*s,-6*s,-9*s,0); ctx.quadraticCurveTo(-9*s,6*s,0,0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,0); ctx.quadraticCurveTo(9*s,-6*s,9*s,0); ctx.quadraticCurveTo(9*s,6*s,0,0); ctx.fill();
      ctx.fillStyle='#ffd43b'; ctx.beginPath(); ctx.arc(0,0,2.6*s,0,Math.PI*2); ctx.fill(); // guzik
      ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.beginPath(); ctx.ellipse(-5*s,-1.5*s,3*s,1.4*s,0.4,0,Math.PI*2); ctx.fill();
      ctx.restore();
    } else {
      // opaska karate
      const band = hurtFlash?'#ff8a8a':'#e11';
      ctx.strokeStyle=band; ctx.lineWidth=3.4*s;
      ctx.beginPath(); ctx.arc(0, headY, headR+0.2*s, Math.PI*1.06, Math.PI*1.94); ctx.stroke();
      const fl = Math.sin(time*7+f.x*0.02)*4*s;
      ctx.lineWidth=3*s; ctx.beginPath();
      ctx.moveTo(-headR+1*s, headY-3*s);
      ctx.quadraticCurveTo(-headR-9*s, headY-1*s+fl, -headR-15*s, headY+4*s+fl*1.5);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-headR+1*s, headY-1*s);
      ctx.quadraticCurveTo(-headR-8*s, headY+3*s-fl, -headR-13*s, headY+8*s-fl);
      ctx.stroke();
    }
  } else {
    // ===== BARAN: uszy, zakręcone rogi, wełniany czub, pysk =====
    const hornCol = hurtFlash ? '#f0ddb4' : (f.isArek ? '#6b5a3a' : '#c7a86f');
    const hornDk  = f.isArek ? '#4a3d26' : '#9c8352';
    // uszy (za głową, zwisające na boki)
    ctx.fillStyle = f.isArek ? '#1a140f' : '#6b5844';
    ctx.beginPath(); ctx.ellipse(-headR*0.85, headY+2.5*s, 4.2*s, 2.2*s, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(headR*0.85, headY+2.5*s, 4.2*s, 2.2*s, 0.5, 0, Math.PI*2); ctx.fill();
    // zakręcone rogi po bokach (spirala do wewnątrz)
    function ramHorn(dir){
      const cx0 = dir*(headR*0.75), cy0 = headY - headR*0.55;
      ctx.lineCap='round'; ctx.lineJoin='round';
      for(let pass=0; pass<2; pass++){
        ctx.strokeStyle = pass===0 ? hornDk : hornCol;
        ctx.lineWidth = (pass===0 ? 5.4 : 4.0)*s;
        ctx.beginPath();
        for(let t=0;t<=1.001;t+=0.08){
          const ang = (dir>0 ? -0.5 : Math.PI+0.5) + dir*t*5.2;
          const rad = (6.4 - t*4.4)*s;
          const px = cx0 + Math.cos(ang)*rad, py = cy0 + Math.sin(ang)*rad + t*3*s;
          t===0?ctx.moveTo(px,py):ctx.lineTo(px,py);
        }
        ctx.stroke();
      }
    }
    ramHorn(-1); ramHorn(1);
    // wełniany czub na głowie
    ctx.fillStyle = hurtFlash ? '#ffe3e3' : (f.isArek ? '#3b3530' : '#efe7d2');
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(i*3*s, headY-headR+1.5*s, 3.3*s, 0, Math.PI*2); ctx.fill(); }
    // pysk (jasny) + nozdrza
    ctx.fillStyle = f.isArek ? '#2a2320' : '#d8cdb8';
    ctx.beginPath(); ctx.ellipse(6.5*s, headY+4.5*s, 5.4*s, 4.2*s, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1512';
    ctx.beginPath(); ctx.ellipse(5*s, headY+3.6*s, 0.9*s,1.3*s,0,0,6.3); ctx.ellipse(8.2*s, headY+3.6*s, 0.9*s,1.3*s,0,0,6.3); ctx.fill();
    // wrogowie — wściekłe świecące oczy + kolorowa opaska
    const eyeCol = f.isArek ? '#ff2020' : '#ffdd33';
    if(f.isArek){ ctx.shadowColor='#ff0000'; ctx.shadowBlur=8; }
    ctx.fillStyle=eyeCol;
    ctx.beginPath(); ctx.arc(3.5*s, headY-0.5*s, (f.isArek?2.3:1.8)*s, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8*s, headY-0.5*s, (f.isArek?2.3:1.8)*s, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    // gniewne brwi
    ctx.strokeStyle = f.beltColor || '#555'; ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.moveTo(1.5*s,headY-4.5*s); ctx.lineTo(5.5*s,headY-2*s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6*s,headY-2*s); ctx.lineTo(10*s,headY-4.5*s); ctx.stroke();
    // opaska w kolorze pasa
    if(f.beltColor){ ctx.strokeStyle=f.beltColor; ctx.lineWidth=3*s;
      ctx.beginPath(); ctx.arc(0, headY, headR+0.2*s, Math.PI*1.08, Math.PI*1.92); ctx.stroke(); }
    // OKULARY przeciwsłoneczne — chronią przed gazem, trzeba je zbić
    if(f.glasses){
      ctx.fillStyle='rgba(15,20,30,0.92)'; ctx.strokeStyle='#000'; ctx.lineWidth=1.4*s;
      ctx.beginPath(); ctx.ellipse(3.5*s, headY-0.3*s, 3.2*s, 2.6*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(8.2*s, headY-0.3*s, 3.2*s, 2.6*s, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.lineWidth=1.6*s; ctx.beginPath(); ctx.moveTo(5.9*s,headY-0.6*s); ctx.lineTo(5.9*s,headY-0.6*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6.4*s,headY-0.8*s); ctx.lineTo(5.3*s,headY-0.8*s); ctx.stroke(); // mostek
      ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1*s;
      ctx.beginPath(); ctx.moveTo(2*s,headY-1.4*s); ctx.lineTo(4*s,headY-1.6*s); ctx.stroke(); // błysk
    }
    // charakterystyczne akcesoria — rozpoznasz typ wroga na pierwszy rzut oka
    if(f.etype==='szybki'){ // punkowy irokez
      ctx.fillStyle=f.beltColor||'#09f';
      for(let i=-2;i<=2;i++){ const bx=i*3*s; ctx.beginPath();
        ctx.moveTo(bx-2*s, headY-headR+2*s); ctx.lineTo(bx, headY-headR-7*s+Math.abs(i)*1.5*s); ctx.lineTo(bx+2*s, headY-headR+2*s); ctx.closePath(); ctx.fill(); }
    } else if(f.etype==='gruby'){ // czapka z daszkiem tyłem
      ctx.fillStyle=f.beltColor||'#960';
      ctx.beginPath(); ctx.arc(0, headY-headR+3*s, headR*0.95, Math.PI*1.02, Math.PI*1.98); ctx.fill();
      ctx.fillRect(-headR*0.95, headY-headR+2.5*s, headR*1.9, 3*s);
      ctx.fillRect(-headR-4*s, headY-headR+3*s, 5*s, 4*s); // daszek z tyłu
    } else if(f.etype==='miotacz'){ // daszek/wizjer
      ctx.fillStyle=f.beltColor||'#0aa';
      ctx.fillRect(-headR, headY-2*s, headR*2, 3.5*s);
      ctx.beginPath(); ctx.moveTo(headR, headY-1*s); ctx.lineTo(headR+8*s, headY+1*s); ctx.lineTo(headR, headY+2.5*s); ctx.closePath(); ctx.fill();
    } else if(f.etype==='ratownik'){ // czerwona czapka ratownika + gwizdek na szyi
      ctx.fillStyle='#ff5252';
      ctx.beginPath(); ctx.arc(0, headY-headR+3.5*s, headR*0.98, Math.PI, Math.PI*2); ctx.fill();
      ctx.fillRect(-headR*0.98, headY-headR+2.6*s, headR*1.96, 2.6*s);
      ctx.beginPath(); ctx.moveTo(headR*0.6, headY-headR+3*s); ctx.lineTo(headR+9*s, headY-headR+5.5*s); ctx.lineTo(headR*0.6, headY-headR+6.5*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#fff'; // krzyżyk ratowniczy
      ctx.fillRect(-1.2*s, headY-headR-1.5*s, 2.4*s, 6*s);
      ctx.fillRect(-3.6*s, headY-headR+0.9*s, 7.2*s, 2.4*s);
      ctx.strokeStyle='#ffd43b'; ctx.lineWidth=1.6*s; // gwizdek
      ctx.beginPath(); ctx.moveTo(-4*s, headY+8*s); ctx.quadraticCurveTo(0, headY+16*s, 4*s, headY+8*s); ctx.stroke();
    } else if(f.etype==='ochroniarz'){ // łysy kark, okulary i słuchawka
      ctx.fillStyle='rgba(255,255,255,.16)'; // połysk łysiny
      ctx.beginPath(); ctx.arc(-2*s, headY-headR*0.45, headR*0.5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#0b0b16'; // ciemne okulary
      rr(-headR-0.5*s, headY-2.4*s, headR*2+1*s, 5.4*s, 1.6*s); ctx.fill();
      ctx.fillStyle=f.beltColor||'#7fd4ff';
      ctx.fillRect(-headR-0.5*s, headY-0.4*s, headR*2+1*s, 1*s);
      ctx.fillStyle='#d8dee8'; // słuchawka + spiralny kabel
      ctx.beginPath(); ctx.arc(-headR+1*s, headY+1*s, 2.4*s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#d8dee8'; ctx.lineWidth=1.3*s;
      ctx.beginPath(); ctx.moveTo(-headR+1*s, headY+3*s); ctx.quadraticCurveTo(-headR-3*s, headY+13*s, -6*s, headY+20*s); ctx.stroke();
    }
  }

  // smuga uderzenia (swoosh)
  if(atkK > 0.3){
    ctx.strokeStyle='rgba(255,255,255,'+(0.55*atkK).toFixed(2)+')';
    ctx.lineWidth=3.5*s; ctx.lineCap='round';
    const swR=(f.pose==='kick'?33:26)*s, swY=(f.pose==='kick'? -32*s : -58*s);
    ctx.beginPath(); ctx.arc(4*s, swY, swR, -0.85, 0.55); ctx.stroke();
    ctx.lineWidth=2*s;
    ctx.beginPath(); ctx.arc(4*s, swY, swR*0.72, -0.7, 0.4); ctx.stroke();
  }

  // --- RĘKA PRZEDNIA (na wierzchu — cios czytelny) ---
  ctx.strokeStyle = limbCol;
  let handF;
  if(armF.ext!==undefined){ const e=armF.ext; handF=twoSeg(sh.x,sh.y,-0.1,aL*(0.6+0.4*e),-0.05,aL*(0.6+0.4*e),armW); }
  else handF=twoSeg(sh.x,sh.y,1.57-armF.a,aL,1.57-armF.b,aL,armW);
  ctx.fillStyle = gi ? skin : (f.isArek?'#2a0000':'#1a1a1a');
  ctx.beginPath(); ctx.arc(handF.hx,handF.hy,(f.isArek?5.5:4.4)*s,0,Math.PI*2); ctx.fill();
  if(f.pose==='punch' && armF.ext>0.6){ // błysk przy pełnym wyproście ciosu
    ctx.fillStyle='rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(handF.hx+4*s,handF.hy,3*s,0,Math.PI*2); ctx.fill();
  }
  // PUSZKA GAZU ŁZAWIĄCEGO — jedyna broń Grega, trzymana w przedniej ręce
  if(gi && !['kneel','slam','zap'].includes(f.pose)){
    ctx.save(); ctx.translate(handF.hx, handF.hy);
    const aim = f.pose==='spray' ? -0.12 : 0.1; ctx.rotate(aim);
    const u = s;
    // puszka (pionowy walec)
    ctx.fillStyle='#c0392b'; rr(-3*u,-11*u,7*u,13*u,2*u); ctx.fill();
    ctx.fillStyle='#e05a4a'; rr(-3*u,-11*u,2.6*u,13*u,2*u); ctx.fill(); // połysk
    ctx.fillStyle='#fff'; rr(-3*u,-5*u,7*u,3.4*u,0.5*u); ctx.fill();    // etykieta
    ctx.fillStyle='#c0392b'; ctx.font='bold '+(3*u)+'px Arial'; ctx.textAlign='center'; ctx.fillText('GAS', 0.4*u, -2.4*u);
    // kołpak rozpylacza
    ctx.fillStyle='#222'; rr(-2.4*u,-14.5*u,6*u,4*u,1.2*u); ctx.fill();
    ctx.fillStyle='#444'; rr(2.4*u,-13.6*u,3.4*u,2.2*u,1*u); ctx.fill(); // dysza wylot
    ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1*u; rr(-3*u,-11*u,7*u,13*u,2*u); ctx.stroke();
    if(f.pose==='spray'){ // obłoczek przy dyszy
      const mk = Math.max(0,1-f.poseT/0.2);
      ctx.fillStyle='rgba(206,224,140,'+(0.6*mk).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(9*u,-12.4*u,(3+mk*4)*u,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  if(f.pose==='kneel' && f===player){ // pierścionek zaręczynowy 💍
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=2.4*s;
    ctx.beginPath(); ctx.arc(handF.hx+2*s, handF.hy-7*s, 4*s, 0, Math.PI*2); ctx.stroke();
    const gl = 0.5 + 0.5*Math.sin(time*9);
    ctx.fillStyle='rgba(190,240,255,'+gl.toFixed(2)+')';
    ctx.beginPath(); ctx.arc(handF.hx+2*s, handF.hy-12*s, 2.2*s, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,'+(gl*0.8).toFixed(2)+')'; ctx.lineWidth=1.2*s;
    ctx.beginPath();
    ctx.moveTo(handF.hx+2*s-5*s, handF.hy-12*s); ctx.lineTo(handF.hx+2*s+5*s, handF.hy-12*s);
    ctx.moveTo(handF.hx+2*s, handF.hy-17*s); ctx.lineTo(handF.hx+2*s, handF.hy-7*s);
    ctx.stroke();
  }

  // --- PORAŻENIE PRĄDEM: aureola wyładowań + kreskówkowy prześwit szkieletu ---
  if(f.pose==='zap'){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(180,225,255,0.85)'; ctx.lineCap='round';
    for(let i=0;i<5;i++){
      const ry = headY + 12*s + i*13*s, rr2 = (16 + Math.sin(time*30+i)*4) * s;
      ctx.lineWidth = 2*s;
      ctx.beginPath();
      for(let k=0;k<=10;k++){
        const ang = k/10*Math.PI*2;
        const rad = rr2 + (Math.random()-0.5)*5*s;
        const px = Math.cos(ang)*rad, py = ry + Math.sin(ang)*rad*0.35;
        k===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    ctx.restore();
    if(zapFlash){ // klatka prześwitu — czaszka i żebra
      ctx.save();
      ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.strokeStyle='rgba(255,255,255,0.92)';
      ctx.beginPath(); ctx.arc(0, headY, headR*0.86, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#2b2b3a';
      ctx.beginPath(); ctx.arc(-3.2*s, headY-0.5*s, 2.4*s, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(3.2*s, headY-0.5*s, 2.4*s, 0, Math.PI*2); ctx.fill();
      ctx.fillRect(-1*s, headY+4*s, 2*s, 3*s);
      ctx.strokeStyle='rgba(255,255,255,0.92)'; ctx.lineWidth=2.6*s; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(0, sh.y-2*s); ctx.lineTo(0, hip.y+2*s); ctx.stroke(); // kręgosłup
      ctx.lineWidth=2.1*s;
      for(let i=0;i<4;i++){
        const ry = sh.y + 3*s + i*7*s;
        ctx.beginPath(); ctx.moveTo(-8.5*s, ry+2*s); ctx.quadraticCurveTo(0, ry-2.5*s, 8.5*s, ry+2*s); ctx.stroke();
      }
      ctx.restore();
    }
  }
  } // --- koniec gałęzi gracz-człowiek (else do if(!gi)) ---

  ctx.restore();

  // pasek HP nad głową (w walce)
  if(state==='fight' && !f.dead && f!==player && !f.ghost){
    const bw = 40*f.scale;
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(f.x-bw/2, f.y-100*f.scale, bw, 5);
    ctx.fillStyle = f.isArek ? '#e11' : '#ff9800';
    ctx.fillRect(f.x-bw/2, f.y-100*f.scale, bw*Math.max(0,f.hp/f.maxHp), 5);
  }
  // imię nad głową (duże i czytelne)
  if(f.name && !f.dead){
    const ny = f.y - 96*f.scale - 16;
    ctx.font = '900 ' + (f.isArek?32:26) + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
    ctx.textAlign='center';
    ctx.lineWidth = 6.5; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineJoin='round';
    ctx.strokeText(f.name, f.x, ny);
    ctx.fillStyle = f.isArek ? '#ff5252' : (f===player ? '#fff' : '#ffd43b');
    ctx.fillText(f.name, f.x, ny);
  }
}

// ---------- broń w dłoni gracza ----------
function drawWeaponInHand(f, handF, s){
  const u = s, key = f.weapon;
  ctx.save();
  ctx.translate(handF.hx, handF.hy);
  const swing = (f.pose==='punch' || f.pose==='kick') ? -0.55*Math.max(0, 1 - f.poseT/0.22) : 0.12;
  ctx.rotate(swing);
  if(key === 'noodle'){                      // makaron basenowy — długa, miękka rura
    const L = 62*u, R = 5.6*u;
    const cols = ['#ff5fa2','#7fd4ff','#fff176','#8bc34a'];
    for(let i=0;i<4;i++){
      ctx.fillStyle = cols[i];
      rr(-8*u + i*(L/4), -R, L/4 + 0.6*u, R*2, R*0.8); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,.35)'; rr(-7*u, -R*0.75, L-2*u, R*0.55, R*0.3); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=1*u; rr(-8*u, -R, L, R*2, R*0.8); ctx.stroke();
  } else if(key === 'umbrella'){             // parasol plażowy — trzonek + czasza
    ctx.strokeStyle='#c9a227'; ctx.lineWidth=3.2*u; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-6*u, 2*u); ctx.lineTo(34*u, -22*u); ctx.stroke();
    ctx.save(); ctx.translate(34*u, -22*u); ctx.rotate(-0.6);
    const cols=['#ff9c00','#fff','#ff5252','#fff','#ff9c00','#fff'];
    for(let i=0;i<6;i++){
      ctx.fillStyle=cols[i];
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.arc(0,0,22*u, Math.PI + i*(Math.PI/6), Math.PI + (i+1)*(Math.PI/6));
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=1.2*u;
    ctx.beginPath(); ctx.arc(0,0,22*u, Math.PI, Math.PI*2); ctx.stroke();
    ctx.restore();
  } else if(key === 'flipflop'){             // klapek — podeszwa z paskiem
    ctx.fillStyle='#8bc34a';
    ctx.beginPath(); ctx.ellipse(9*u, 0, 13*u, 6*u, 0.12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#5f8f28';
    ctx.beginPath(); ctx.ellipse(9*u, 1.6*u, 13*u, 4.4*u, 0.12, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#ff5252'; ctx.lineWidth=2.4*u; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(2*u,-3*u); ctx.lineTo(12*u,-1*u); ctx.lineTo(17*u,-4*u); ctx.stroke();
  } else if(key === 'bucket'){               // wiaderko z lodem
    ctx.fillStyle='#7fd4ff';
    ctx.beginPath(); ctx.moveTo(2*u,-2*u); ctx.lineTo(24*u,-2*u); ctx.lineTo(20*u,16*u); ctx.lineTo(6*u,16*u); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#4fa8d8'; rr(1*u,-5*u,24*u,4*u,2*u); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.85)';
    [[7,-9,4],[13,-11,5],[19,-8,4]].forEach(c=>{
      rr(c[0]*u, c[1]*u, c[2]*u, c[2]*u, 1.2*u); ctx.fill();
    });
    ctx.strokeStyle='rgba(0,60,90,.35)'; ctx.lineWidth=1.1*u;
    ctx.beginPath(); ctx.moveTo(2*u,-2*u); ctx.lineTo(24*u,-2*u); ctx.lineTo(20*u,16*u); ctx.lineTo(6*u,16*u); ctx.closePath(); ctx.stroke();
  }
  ctx.restore();
}

// ---------- błyskawica (packa pani Gosi) ----------
function drawLightning(x1, y1, x2, y2, seg, amp, col, w){
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(x1, y1);
  for(let i=1;i<seg;i++){
    const k = i/seg;
    ctx.lineTo(x1 + (x2-x1)*k + (Math.random()-0.5)*amp, y1 + (y2-y1)*k + (Math.random()-0.5)*amp);
  }
  ctx.lineTo(x2, y2); ctx.stroke();
}

// ---------- MS GOSIA — kierowniczka basenu, gwizdek i packa elektryczna ----------
function drawGosia(){
  const g = gosia;
  if(!g || !g.shown) return;
  const s = 1.2;
  const headY = -80*s, headR = 10*s;
  const skin = '#f6c9a0', uni = '#123a63', hair = '#b9bec9';
  const kk = g.pose==='kick' ? Math.min(1, Math.max(0, (g.kickT - 0.06)/0.16)) : 0;
  const zapping = g.pose==='zap';

  // cień
  ctx.save(); ctx.globalAlpha=0.26; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(g.x, GROUND+2, 21*s, 5.5*s, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();

  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.scale(g.facing, 1);
  const bob = g.pose==='walk' ? Math.abs(Math.cos(g.walkT))*2.4 : Math.sin(time*2.6)*1.2;
  ctx.translate(0, -bob);
  ctx.lineCap='round'; ctx.lineJoin='round';

  // NOGI (białe adidasy kierowniczki)
  ctx.strokeStyle = skin; ctx.lineWidth = 6.4*s;
  const sw = g.pose==='walk' ? Math.sin(g.walkT)*9*s : 0;
  ctx.beginPath(); ctx.moveTo(-3*s,-34*s); ctx.lineTo(-4*s - sw, -2*s); ctx.stroke();
  if(kk > 0){ // noga robocza w kopniaku — prosto do przodu
    ctx.beginPath(); ctx.moveTo(3*s,-34*s); ctx.lineTo(20*s*kk + 4*s, -34*s - 6*s*kk); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(22*s*kk + 6*s, -34*s - 6*s*kk, 6*s, 4*s, 0.2, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.beginPath(); ctx.moveTo(3*s,-34*s); ctx.lineTo(4*s + sw, -2*s); ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(4*s + sw, -1*s, 6.5*s, 3.6*s, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(-4*s - sw, -1*s, 6.5*s, 3.6*s, 0, 0, Math.PI*2); ctx.fill();

  // SZORTY SŁUŻBOWE
  ctx.fillStyle='#0c2745';
  ctx.beginPath();
  ctx.moveTo(-10*s,-46*s); ctx.lineTo(10*s,-46*s); ctx.lineTo(9*s,-31*s); ctx.lineTo(-9*s,-31*s); ctx.closePath(); ctx.fill();

  // POLO Z NAPISEM STAFF
  ctx.fillStyle = uni;
  ctx.beginPath();
  ctx.moveTo(-11*s,-44*s); ctx.lineTo(-13*s,-66*s);
  ctx.quadraticCurveTo(0,-71*s, 13*s,-66*s);
  ctx.lineTo(11*s,-44*s); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(2*s,-70*s,14*s,30*s);
  ctx.fillStyle='rgba(255,255,255,.9)'; ctx.font='700 '+(6*s)+'px Arial'; ctx.textAlign='center';
  ctx.fillText('STAFF', 0, -54*s);
  ctx.restore();
  // kołnierzyk
  ctx.fillStyle='#e8eef7';
  ctx.beginPath(); ctx.moveTo(-6*s,-66*s); ctx.lineTo(0,-60*s); ctx.lineTo(6*s,-66*s); ctx.closePath(); ctx.fill();

  // GWIZDEK NA CZERWONYM SZNURKU
  ctx.strokeStyle='#e63946'; ctx.lineWidth=1.8*s;
  ctx.beginPath(); ctx.moveTo(-5*s,-64*s); ctx.quadraticCurveTo(0,-52*s, 5*s,-64*s); ctx.stroke();
  ctx.fillStyle='#ffd43b';
  rr(-2.5*s,-54*s,7*s,4*s,1.6*s); ctx.fill();

  // RĘKA TYLNA (na biodrze — poza kierowniczej)
  ctx.strokeStyle = skin; ctx.lineWidth = 5*s;
  ctx.beginPath(); ctx.moveTo(-9*s,-63*s); ctx.lineTo(-15*s,-54*s); ctx.lineTo(-9*s,-46*s); ctx.stroke();

  // RĘKA PRZEDNIA + PACKA ELEKTRYCZNA
  let hx, hy;
  if(zapping){       hx = 26*s; hy = -86*s; }
  else if(g.pose==='point'){ hx = 30*s; hy = -68*s; }
  else if(kk > 0){   hx = 16*s; hy = -74*s; }
  else {             hx = 18*s; hy = -52*s; }
  ctx.strokeStyle = skin; ctx.lineWidth = 5*s;
  ctx.beginPath(); ctx.moveTo(9*s,-63*s); ctx.lineTo((9*s+hx)/2 + 3*s, (-63*s+hy)/2); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(hx, hy, 3.6*s, 0, Math.PI*2); ctx.fill();

  if(g.pose === 'point'){
    // wyprostowany palec oskarżycielski
    ctx.strokeStyle = skin; ctx.lineWidth = 3.2*s;
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + 9*s, hy - 1*s); ctx.stroke();
  } else {
    // PACKA ELEKTRYCZNA — rakietka z siatką pod napięciem
    ctx.save(); ctx.translate(hx, hy); ctx.rotate(zapping ? -0.5 : 0.25);
    ctx.strokeStyle='#2b2b3a'; ctx.lineWidth=3*s;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(11*s,-3*s); ctx.stroke();
    ctx.fillStyle='#ffd43b';
    rr(10*s,-16*s,20*s,26*s,4*s); ctx.fill();
    ctx.fillStyle = zapping ? 'rgba(180,235,255,0.95)' : 'rgba(150,215,255,0.55)';
    rr(13*s,-13*s,14*s,20*s,2.5*s); ctx.fill();

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function wrapText(txt, x, y, maxW, lh){
  const words = txt.split(' ');
  let line = '', yy = y;
  for(const w of words){
    const test = line ? line + ' ' + w : w;
    if(ctx.measureText(test).width > maxW){ ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  ctx.fillText(line, x, yy);
}

function bubble(x, y, txt){
  // dymek dialogowy z ogonkiem; y = dolna krawędź dymka
  ctx.font='700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
  const w = ctx.measureText(txt).width + 26;
  const bx = Math.max(10, Math.min(W - 10 - w, x - w/2));
  rr(bx, y - 30, w, 30, 12);
  ctx.fillStyle='rgba(255,255,255,.96)'; ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.2)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.96)';
  ctx.beginPath(); ctx.moveTo(x-6, y-1); ctx.lineTo(x+6, y-1); ctx.lineTo(x, y+8); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#1a2038'; ctx.textAlign='center';
  ctx.fillText(txt, bx + w/2, y - 10);
}

function nameTag(text, x, y, color){
  ctx.font = '900 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial'; ctx.textAlign='center';
  ctx.lineWidth = 6.5; ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineJoin='round';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

// ---------- HALLOWEEN: rysowanie ----------
function pumpkinPath(cx,cy,r){ // bania dyni (kilka zachodzących elips)
  ctx.beginPath();
  ctx.ellipse(cx,cy,r*1.05,r,0,0,Math.PI*2);
  ctx.ellipse(cx-r*0.5,cy,r*0.62,r*0.96,0,0,Math.PI*2);
  ctx.ellipse(cx+r*0.5,cy,r*0.62,r*0.96,0,0,Math.PI*2);
}
function drawOnePumpkin(cx,cy,r,rot,jack){
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot||0); ctx.translate(-cx,-cy);
  // poświata (bloom) — prawdziwe rozmycie, jeśli silnik canvas je wspiera
  const canFilter = (typeof ctx.filter==='string');
  if(jack){ ctx.save(); if(canFilter) ctx.filter='blur(6px)';
    ctx.fillStyle='rgba(255,150,30,0.55)'; ctx.beginPath(); ctx.arc(cx,cy,r*1.5,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  // ciało
  const pg=ctx.createRadialGradient(cx-r*0.4,cy-r*0.4,r*0.2,cx,cy,r*1.2);
  pg.addColorStop(0,'#ffb04a'); pg.addColorStop(0.6,'#f07e12'); pg.addColorStop(1,'#c4560a');
  ctx.fillStyle=pg; pumpkinPath(cx,cy,r); ctx.fill();
  // żłobienia
  ctx.strokeStyle='rgba(150,60,0,0.5)'; ctx.lineWidth=Math.max(1,r*0.08);
  for(const d of [-0.5,0,0.5]){ ctx.beginPath(); ctx.ellipse(cx+d*r,cy,r*0.24,r*0.95,0,0,Math.PI*2); ctx.stroke(); }
  // ogonek
  ctx.strokeStyle='#5a3310'; ctx.lineWidth=Math.max(2,r*0.16); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx,cy-r*0.95); ctx.lineTo(cx+r*0.12,cy-r*1.35); ctx.stroke();
  if(jack){ // uśmiech dyni z poświatą
    ctx.fillStyle='#fff3b0';
    ctx.beginPath(); ctx.moveTo(cx-r*0.5,cy-r*0.25); ctx.lineTo(cx-r*0.2,cy-r*0.05); ctx.lineTo(cx-r*0.55,cy-r*0.02); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+r*0.5,cy-r*0.25); ctx.lineTo(cx+r*0.2,cy-r*0.05); ctx.lineTo(cx+r*0.55,cy-r*0.02); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx,cy-r*0.1); ctx.lineTo(cx+r*0.18,cy+r*0.12); ctx.lineTo(cx-r*0.18,cy+r*0.12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx-r*0.55,cy+r*0.25); ctx.quadraticCurveTo(cx,cy+r*0.62,cx+r*0.55,cy+r*0.25);
    ctx.lineTo(cx+r*0.4,cy+r*0.45); ctx.lineTo(cx+r*0.18,cy+r*0.3); ctx.lineTo(cx,cy+r*0.48);
    ctx.lineTo(cx-r*0.18,cy+r*0.3); ctx.lineTo(cx-r*0.4,cy+r*0.45); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.ellipse(cx-r*0.4,cy-r*0.4,r*0.22,r*0.32,-0.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawPumpkins(){
  for(const p of pumpkins){
    // smuga za lecącą dynią
    ctx.save(); ctx.globalAlpha=0.3; ctx.strokeStyle='rgba(255,140,30,0.8)'; ctx.lineWidth=p.r*0.8; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*0.03,p.y-p.vy*0.03); ctx.stroke(); ctx.restore();
    drawOnePumpkin(p.x,p.y,p.r,p.rot,true);
  }
}
function drawPumpkinSplats(){
  for(const s of pumpkinSplats){
    const k=s.life/s.max;
    ctx.save(); ctx.globalAlpha=k*0.8; ctx.fillStyle='#e8760f';
    ctx.beginPath(); ctx.ellipse(s.x,s.y,(1.2-k)*26+8,((1.2-k)*26+8)*0.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffc23a';
    ctx.beginPath(); ctx.ellipse(s.x,s.y,((1.2-k)*26+8)*0.6,((1.2-k)*26+8)*0.24,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawWitch(w){
  const x=w.x, y=w.y, f=w.facing||1, bob=Math.sin(w.ph*2)*2;
  ctx.save(); ctx.translate(x,y+bob); ctx.scale(f,1);
  // poświata księżycowa wokół (bloom)
  const canFilter=(typeof ctx.filter==='string');
  if(w.spook>0){ ctx.save(); if(canFilter) ctx.filter='blur(5px)';
    ctx.fillStyle='rgba(150,230,180,0.5)'; ctx.beginPath(); ctx.arc(0,-6,34,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  // MIOTŁA
  ctx.strokeStyle='#5a3a16'; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-34,14); ctx.lineTo(30,10); ctx.stroke();
  ctx.fillStyle='#c79a3a'; // witki
  for(let i=0;i<7;i++){ ctx.save(); ctx.translate(30,10); ctx.rotate((i-3)*0.12);
    ctx.fillRect(0,-1.4,22,2.8); ctx.restore(); }
  ctx.strokeStyle='#8a5a1e'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(28,4); ctx.lineTo(28,16); ctx.stroke();
  // SZATA (powiewa)
  const rob=ctx.createLinearGradient(0,-8,0,36);
  rob.addColorStop(0,w.robe); rob.addColorStop(1,'#1a0a28');
  ctx.fillStyle=rob;
  ctx.beginPath(); ctx.moveTo(-10,-6);
  ctx.quadraticCurveTo(-26,24,-30+Math.sin(w.ph*3)*4,40);
  ctx.quadraticCurveTo(-4,30,8,38);
  ctx.quadraticCurveTo(14,20,10,-6); ctx.closePath(); ctx.fill();
  // tułów/ramię
  ctx.fillStyle=w.robe; ctx.beginPath(); ctx.ellipse(-2,-10,9,12,0,0,Math.PI*2); ctx.fill();
  // ręka trzyma miotłę
  ctx.strokeStyle=w.robe; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(-2,-8); ctx.lineTo(10,6); ctx.stroke();
  // GŁOWA
  ctx.fillStyle='#bfe3a0'; // zielonkawa cera wiedźmy
  ctx.beginPath(); ctx.arc(-2,-24,8.5,0,Math.PI*2); ctx.fill();
  // nos haczykowaty
  ctx.fillStyle='#a9d089'; ctx.beginPath(); ctx.moveTo(3,-24); ctx.lineTo(10,-21); ctx.lineTo(3,-19); ctx.fill();
  // oczy
  ctx.fillStyle='#1a1008'; ctx.beginPath(); ctx.arc(-4,-26,1.5,0,Math.PI*2); ctx.arc(1,-26,1.5,0,Math.PI*2); ctx.fill();
  if(w.cackle>0){ ctx.strokeStyle='#1a1008'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(-2,-21,3,0.1,Math.PI-0.1); ctx.stroke(); }
  // włosy
  ctx.strokeStyle=w.hair; ctx.lineWidth=2.4; ctx.lineCap='round';
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.moveTo(-8,-28+i*2); ctx.quadraticCurveTo(-18,-20+i*3,-16,-10+i*3); ctx.stroke(); }
  // KAPELUSZ spiczasty
  ctx.fillStyle=w.hat;
  ctx.beginPath(); ctx.ellipse(-2,-31,13,4,0,0,Math.PI*2); ctx.fill(); // rondo
  ctx.beginPath(); ctx.moveTo(-10,-31); ctx.quadraticCurveTo(-1,-34,6,-31);
  ctx.quadraticCurveTo(2,-46,-3,-54); ctx.quadraticCurveTo(-7,-40,-10,-31); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#e0b020'; ctx.fillRect(-9,-33,15,2.6); // opaska
  // dynia w dłoni gdy zaraz rzuci
  if(w.cackle>0.2){ drawOnePumpkin(16,2,7,time*3,false); }
  ctx.restore();
  nameTag(w.name, x, y-58+bob, w.spook>0?'#9adcff':'#d8a6ff');
}

function drawScene(){
  const HORIZON = GROUND - 70;
  const BX = viewL, BW = viewR - viewL; // tło liczone w świecie, żeby kamera mogła jechać
  const fix = camX;                     // warstwa „przyklejona" do ekranu (słońce, chmury)
  // niebo — HALLOWEENOWY zmierzch: fiolet u góry, pomarańcz nad horyzontem
  if(!G.sky){ G.sky = ctx.createLinearGradient(0,0,0,GROUND);
    G.sky.addColorStop(0,'#1a0b2e'); G.sky.addColorStop(0.4,'#3a1a52'); G.sky.addColorStop(0.72,'#8c3d6a'); G.sky.addColorStop(0.9,'#e07a3a'); G.sky.addColorStop(1,'#ffb060'); }
  ctx.fillStyle = G.sky; ctx.fillRect(BX,0,BW,GROUND);
  // gwiazdy
  ctx.save(); ctx.translate(fix*0.5,0); ctx.fillStyle='rgba(255,255,230,0.9)';
  for(let i=0;i<40;i++){ const sx=(i*137.5)%(BW), sy=((i*71)%180), tw=0.4+0.6*Math.abs(Math.sin(time*2+i));
    ctx.globalAlpha=tw*0.8; ctx.fillRect(BX-fix*0.5+sx, sy, 1.6, 1.6); }
  ctx.restore(); ctx.globalAlpha=1;
  // KSIĘŻYC — wielka dyniowa tarcza z poświatą (bloom przez rozmycie)
  ctx.save(); ctx.translate(W-150+fix*0.4,96);
  const canF=(typeof ctx.filter==='string');
  if(canF){ ctx.save(); ctx.filter='blur(16px)'; ctx.fillStyle='rgba(255,180,90,0.5)';
    ctx.beginPath(); ctx.arc(0,0,78,0,Math.PI*2); ctx.fill(); ctx.restore(); }
  const mglow = ctx.createRadialGradient(0,0,20,0,0,120);
  mglow.addColorStop(0,'rgba(255,210,150,.55)'); mglow.addColorStop(0.5,'rgba(255,170,90,.18)'); mglow.addColorStop(1,'rgba(255,170,90,0)');
  ctx.fillStyle=mglow; ctx.beginPath(); ctx.arc(0,0,120,0,Math.PI*2); ctx.fill();
  const moon = ctx.createRadialGradient(-14,-14,8,0,0,50);
  moon.addColorStop(0,'#fff2d0'); moon.addColorStop(0.6,'#ffd98a'); moon.addColorStop(1,'#f3b45a');
  ctx.fillStyle=moon; ctx.beginPath(); ctx.arc(0,0,48,0,Math.PI*2); ctx.fill();
  // kratery
  ctx.fillStyle='rgba(190,120,50,0.35)';
  [[14,-8,9],[-6,18,7],[22,20,5],[-20,-4,6]].forEach(([mx,my,mr])=>{ ctx.beginPath(); ctx.arc(mx,my,mr,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
  // NIETOPERZE przelatujące na tle księżyca i nieba
  ctx.fillStyle='#120a1e';
  for(const b of bats){
    if(b.x < BX-40 || b.x > BX+BW+40) continue;
    const wingY = Math.sin(b.ph)*5*b.sc;
    ctx.save(); ctx.translate(b.x, b.y);
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-7*b.sc,-wingY-6*b.sc,-14*b.sc,wingY);
    ctx.quadraticCurveTo(-8*b.sc,wingY+2*b.sc,-5*b.sc,wingY+1*b.sc);
    ctx.lineTo(0,3*b.sc);
    ctx.lineTo(5*b.sc,wingY+1*b.sc);
    ctx.quadraticCurveTo(8*b.sc,wingY+2*b.sc,14*b.sc,wingY);
    ctx.quadraticCurveTo(7*b.sc,-wingY-6*b.sc,0,0); ctx.fill();
    ctx.beginPath(); ctx.arc(0,-1*b.sc,2.4*b.sc,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  // chmury dryfujące (miękkie, dwuwarstwowe)
  [[240,84,1,10],[520,56,0.8,7],[760,104,1.2,13],[100,134,0.6,5]].forEach(([cx0,cy,cs,spd])=>{
    const cx = ((cx0 + time*spd) % (W+160)) - 80 + fix*0.78; // chmury: delikatny parallax
    ctx.fillStyle='rgba(40,24,56,.6)'; // nocne, mroczne chmury
    ctx.beginPath();
    ctx.arc(cx,cy,20*cs,0,Math.PI*2); ctx.arc(cx+22*cs,cy-9*cs,16*cs,0,Math.PI*2); ctx.arc(cx+44*cs,cy,18*cs,0,Math.PI*2);
    ctx.arc(cx+22*cs,cy+4*cs,15*cs,0,Math.PI*2); ctx.fill();
  });
  // dalekie morze na horyzoncie + wyspy
  if(!G.sea){ G.sea = ctx.createLinearGradient(0,HORIZON,0,GROUND);
    G.sea.addColorStop(0,'#3aa0d8'); G.sea.addColorStop(1,'#2b7fc0'); }
  ctx.fillStyle=G.sea; ctx.fillRect(BX,HORIZON,BW,GROUND-HORIZON);
  ctx.fillStyle='#5aa06a';
  [[180,26],[430,20],[880,30],[1240,24],[1600,32]].forEach(([ix0,ih])=>{
    const ix = ix0 + fix*0.86; // wyspy: daleki plan, prawie nie uciekają
    if(ix < BX-80 || ix > BX+BW+80) return;
    ctx.beginPath(); ctx.moveTo(ix-ih*1.8,HORIZON+2);
    ctx.quadraticCurveTo(ix,HORIZON-ih, ix+ih*1.8,HORIZON+2); ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle='rgba(255,255,255,.4)';
  for(let i=0;i<5;i++){ const yy=HORIZON+10+i*10; ctx.fillRect(BX, yy, BW, 1.5); }
  // (daleki skyline wieżowców usunięty — te prostokąty tylko przeszkadzały)
  // mgła atmosferyczna na horyzoncie
  const haze=ctx.createLinearGradient(0,HORIZON-50,0,HORIZON+20);
  haze.addColorStop(0,'rgba(200,225,240,0)'); haze.addColorStop(1,'rgba(200,225,240,0.55)');
  ctx.fillStyle=haze; ctx.fillRect(BX,HORIZON-50,BW,70);
  // mewy
  ctx.strokeStyle='rgba(40,50,70,.55)'; ctx.lineWidth=2; ctx.lineCap='round';
  [[0,60,17],[1,40,11],[2,150,9]].forEach(([k,gy,spd])=>{
    const gx=((k*260 + time*spd) % (W+80))-40 + fix*0.86, fl=Math.sin(time*4+k)*3;
    ctx.beginPath(); ctx.moveTo(gx-8,gy+fl); ctx.quadraticCurveTo(gx,gy-4+fl,gx+2,gy+fl);
    ctx.quadraticCurveTo(gx+4,gy-4+fl,gx+12,gy+fl); ctx.stroke();
  });
  // pomost — drewniane deski
  const plankH = (H-GROUND)/4;
  if(!G.planks){ G.planks=[]; for(let r=0;r<4;r++){ const y=GROUND+r*plankH;
    const pg=ctx.createLinearGradient(0,y,0,y+plankH);
    pg.addColorStop(0, r%2? '#c4934f':'#cf9f60'); pg.addColorStop(0.5,'#bd8f52'); pg.addColorStop(1, r%2?'#b3854a':'#c1955a');
    G.planks.push(pg); } }
  for(let r=0;r<4;r++){
    const y=GROUND+r*plankH;
    ctx.fillStyle=G.planks[r]; ctx.fillRect(BX,y,BW,plankH-1.5);
    ctx.fillStyle='rgba(90,60,25,.35)'; ctx.fillRect(BX,y+plankH-2,BW,2);
  }
  ctx.strokeStyle='rgba(80,52,20,.28)'; ctx.lineWidth=1.5;
  for(let x=BX-(BX%128)-64;x<BX+BW;x+=128){ for(let r=0;r<4;r++){ const off=(r%2)*64; ctx.beginPath(); ctx.moveTo(x+off,GROUND+r*plankH); ctx.lineTo(x+off,GROUND+(r+1)*plankH); ctx.stroke(); } }
  // krawędź pomostu (cień pod nogami)
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(BX,GROUND,BW,2);
  ctx.fillStyle='rgba(60,40,15,.3)'; ctx.fillRect(BX,GROUND+4,BW,3);
  // BUDYNKI KURORTU — różne obiekty na promenadzie (postęp widoczny)
  drawResortBuildings(viewL, viewR);
  // basen na końcu kurortu — rysowany tylko wtedy, gdy kamera go widzi
  if(POOL.x < viewR + 320 && POOL.x + POOL.w > viewL - 320){
  ctx.fillStyle='#eaf4fb'; ctx.fillRect(POOL.x-10, POOL.top-6, POOL.w+20, POOL.depth+18);
  ctx.fillStyle='#9fd0ec'; ctx.fillRect(POOL.x-10, POOL.top-6, POOL.w+20, 4);
  // woda — głęboki gradient + połysk
  if(!G.water){ G.water = ctx.createLinearGradient(0,POOL.top,0,POOL.top+POOL.depth);
    G.water.addColorStop(0,'#5cc6f0'); G.water.addColorStop(0.5,'#2b9fd8'); G.water.addColorStop(1,'#0e5f9e'); }
  const water = G.water;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(POOL.x, POOL.top);
  for(let x=0;x<=POOL.w;x+=8) ctx.lineTo(POOL.x+x, POOL.top + Math.sin(time*3 + x*0.09)*2.5);
  ctx.lineTo(POOL.x+POOL.w, POOL.top+POOL.depth);
  ctx.lineTo(POOL.x, POOL.top+POOL.depth);
  ctx.closePath();
  ctx.fillStyle = water; ctx.fill();
  ctx.clip(); // efekty tylko wewnątrz wody
  // animowane refleksy świetlne (caustics)
  ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=3; ctx.lineCap='round';
  for(let i=0;i<7;i++){
    const yy = POOL.top+10+i*8;
    ctx.beginPath();
    for(let x=0;x<=POOL.w;x+=12){
      const yb = yy + Math.sin(time*2 + x*0.12 + i)*3;
      x===0 ? ctx.moveTo(POOL.x+x, yb) : ctx.lineTo(POOL.x+x, yb);
    }
    ctx.stroke();
  }
  // połysk na powierzchni
  const sheen = ctx.createLinearGradient(0,POOL.top,0,POOL.top+16);
  sheen.addColorStop(0,'rgba(255,255,255,0.5)'); sheen.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=sheen; ctx.fillRect(POOL.x, POOL.top, POOL.w, 16);
  // migoczące iskry
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<6;i++){
    const sx=POOL.x+20+((i*57+time*24)%(POOL.w-30)), sy=POOL.top+18+(i*7)%36;
    const tw=0.4+0.6*Math.abs(Math.sin(time*3+i));
    ctx.globalAlpha=tw; ctx.beginPath(); ctx.arc(sx,sy,1.6,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  // dmuchany flaming dryfujący po wodzie (życie w tle)
  if(!(state==='lose' && cut && ['girlThrow','girlSunk'].includes(cut.phase))){
    const fx = POOL.x + 60 + Math.sin(time*0.5)*40, fy = POOL.top + 12 + Math.sin(time*1.6)*2;
    ctx.save(); ctx.translate(fx, fy);
    ctx.fillStyle='#ff8fc8'; // pływak-koło
    ctx.beginPath(); ctx.ellipse(0,4,17,9,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffb3d9'; ctx.beginPath(); ctx.ellipse(0,3,10,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(43,159,216,0.55)'; ctx.beginPath(); ctx.ellipse(0,4,10,5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ff8fc8'; // szyja + głowa flaminga
    ctx.beginPath(); ctx.moveTo(-6,2); ctx.quadraticCurveTo(-16,-16,-8,-22); ctx.quadraticCurveTo(-2,-26,-3,-18);
    ctx.quadraticCurveTo(-6,-12,-2,2); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-6,-20,1.4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffb703'; ctx.beginPath(); ctx.moveTo(-8,-19); ctx.lineTo(-13,-18); ctx.lineTo(-8,-16); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // drabinka
  ctx.strokeStyle='#eee'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(POOL.x+8, POOL.top-12); ctx.lineTo(POOL.x+8, POOL.top+30);
  ctx.moveTo(POOL.x+20, POOL.top-12); ctx.lineTo(POOL.x+20, POOL.top+30);
  ctx.moveTo(POOL.x+8, POOL.top); ctx.lineTo(POOL.x+20, POOL.top);
  ctx.moveTo(POOL.x+8, POOL.top+14); ctx.lineTo(POOL.x+20, POOL.top+14);
  ctx.stroke();
  } // koniec basenu

  // dekoracje kurortu — palmy, leżaki, bar, wieża, prysznice, kabiny, VIP
  drawProps();

  // znajdźki na decku: hot-dogi + broń (świecą, żeby rzucały się w oczy)
  if(items) for(const it of items){
    const by = it.y !== undefined ? it.y : (GROUND - 8 - Math.abs(Math.sin(it.t*3))*9);
    const w = it.kind === 'weapon' ? WEAPONS[it.w] : null;
    const icon = w ? w.icon : (it.kind === 'coin' ? '💰' : it.kind === 'medal' ? '🏅' : '🌭');
    const col  = w ? w.col  : (it.kind === 'hotdog' ? '#8bc34a' : '#ffd43b');
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.25*Math.sin(it.t*4);
    const gr = ctx.createRadialGradient(it.x, GROUND-4, 0, it.x, GROUND-4, 32);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.ellipse(it.x, GROUND-4, 32, 11, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.font=(it.kind === 'medal' ? '30px' : '26px') + ' Arial'; ctx.textAlign='center';
    ctx.fillText(icon, it.x, by);
    if(w){
      ctx.font='800 10px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial'; ctx.lineJoin='round';
      ctx.lineWidth=3.5; ctx.strokeStyle='rgba(0,0,0,.7)';
      ctx.strokeText(w.name, it.x, by - 26);
      ctx.fillStyle=col; ctx.fillText(w.name, it.x, by - 26);
    }
  }
}

// ---- BUDYNKI KURORTU: różne na całej promenadzie, żeby było widać postęp ----
const BUILDINGS = [
  {x:360,  type:'bar'},    {x:760,  type:'cabana'}, {x:1180, type:'tower'},
  {x:1600, type:'icecream'},{x:2050, type:'hotel'}, {x:2520, type:'surf'},
  {x:2980, type:'cabana'}, {x:3440, type:'bar'},    {x:3900, type:'snack'},
  {x:4360, type:'hotel'},  {x:4820, type:'tower'}
];
function drawResortBuildings(vl, vr){
  const yb = GROUND - 4; // osadzone na promenadzie
  for(const b of BUILDINGS){
    if(b.x < vl-220 || b.x > vr+220) continue;   // culling
    ctx.save(); ctx.translate(b.x, yb);
    // cień pod budynkiem
    ctx.fillStyle='rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0,2,70,8,0,0,Math.PI*2); ctx.fill();
    drawBuilding(b.type);
    ctx.restore();
  }
}
function winGrid(x,y,w,h,cols,rows,lit){
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const on = ((i*7+j*3)%5===0);
    ctx.fillStyle = (lit&&on) ? 'rgba(255,224,150,0.95)' : 'rgba(150,200,235,0.85)';
    ctx.fillRect(x+i*(w/cols)+2, y+j*(h/rows)+2, w/cols-4, h/rows-4);
  }
}
function drawBuilding(type){
  // wszystko rysowane w górę od (0,0) = poziom promenady
  if(type==='hotel'){
    const w=150,h=150;
    const g=ctx.createLinearGradient(-w/2,0,w/2,0); g.addColorStop(0,'#e7d9c2'); g.addColorStop(1,'#cdb998');
    ctx.fillStyle=g; rr(-w/2,-h,w,h,6); ctx.fill();
    ctx.fillStyle='#b89f7e'; ctx.fillRect(-w/2,-h,w,10);          // gzyms
    ctx.fillStyle='#8a6b4a'; rr(-w/2-8,-h-14,w+16,16,4); ctx.fill(); // dach
    winGrid(-w/2+10,-h+22, w-20, h-40, 5, 4, true);
    ctx.fillStyle='#2b6fb5'; rr(-22,-34,44,34,3); ctx.fill();      // drzwi/lobby
  } else if(type==='bar'){
    const w=130,h=74;
    ctx.fillStyle='#caa26a'; rr(-w/2,-h,w,h,5); ctx.fill();
    ctx.fillStyle='#8b5a2b'; for(let i=-2;i<=2;i++) ctx.fillRect(i*28-3,-h,6,h); // bambus
    // strzecha
    ctx.fillStyle='#c79a4f'; ctx.beginPath(); ctx.moveTo(-w/2-16,-h); ctx.lineTo(0,-h-36); ctx.lineTo(w/2+16,-h); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#a87f3c'; for(let i=-3;i<=3;i++){ ctx.beginPath(); ctx.moveTo(i*10,-h); ctx.lineTo(i*8,-h-30); ctx.lineTo(i*10+4,-h); ctx.fill(); }
    ctx.fillStyle='#4a3524'; ctx.fillRect(-w/2+8,-34,w-16,8); // bar
  } else if(type==='cabana'){
    const w=96,h=70;
    // paski markizy
    for(let i=0;i<6;i++){ ctx.fillStyle=i%2?'#ffffff':'#e0564e'; ctx.fillRect(-w/2+i*(w/6),-h,w/6,h); }
    ctx.fillStyle='rgba(0,0,0,0.12)'; ctx.fillRect(-w/2,-20,w,20);
    // daszek
    ctx.fillStyle='#c0392b'; ctx.beginPath(); ctx.moveTo(-w/2-8,-h); ctx.lineTo(0,-h-24); ctx.lineTo(w/2+8,-h); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(-w/2-8,-h); ctx.lineTo(-w/6,-h-18); ctx.lineTo(-w/6+8,-h); ctx.fill();
  } else if(type==='tower'){
    const w=58,h=120;
    ctx.strokeStyle='#9c6b3a'; ctx.lineWidth=7; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-w/2+6,0); ctx.lineTo(-w/2+14,-h+40); ctx.moveTo(w/2-6,0); ctx.lineTo(w/2-14,-h+40); ctx.stroke();
    ctx.fillStyle='#d94f4f'; rr(-w/2,-h+10,w,46,4); ctx.fill();       // kabina
    ctx.fillStyle='#fff'; ctx.fillRect(-w/2+6,-h+18,w-12,16);          // okno
    ctx.fillStyle='#b5392f'; ctx.beginPath(); ctx.moveTo(-w/2-6,-h+10); ctx.lineTo(0,-h-14); ctx.lineTo(w/2+6,-h+10); ctx.closePath(); ctx.fill();
  } else if(type==='icecream'){
    const w=80,h=60;
    const g=ctx.createLinearGradient(0,-h,0,0); g.addColorStop(0,'#ffe0ec'); g.addColorStop(1,'#ffc0d8');
    ctx.fillStyle=g; rr(-w/2,-h,w,h,5); ctx.fill();
    for(let i=0;i<5;i++){ ctx.fillStyle=i%2?'#ff5fa2':'#fff'; ctx.fillRect(-w/2+i*(w/5),-h-14,w/5,14); } // markiza
    ctx.fillStyle='#fff'; ctx.fillRect(-w/2+8,-h+14,w-16,26); // lada
    // wielki rożek na dachu
    ctx.save(); ctx.translate(0,-h-14);
    ctx.fillStyle='#e8b06a'; ctx.beginPath(); ctx.moveTo(-10,0); ctx.lineTo(0,26); ctx.lineTo(10,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#ff8fc8'; ctx.beginPath(); ctx.arc(-4,-4,8,0,Math.PI*2); ctx.arc(5,-3,8,0,Math.PI*2); ctx.arc(0,-11,8,0,Math.PI*2); ctx.fill();
    ctx.restore();
  } else if(type==='surf'){
    const w=104,h=66;
    const g=ctx.createLinearGradient(0,-h,0,0); g.addColorStop(0,'#5fb6c9'); g.addColorStop(1,'#3d93a6');
    ctx.fillStyle=g; rr(-w/2,-h,w,h,5); ctx.fill();
    ctx.fillStyle='#2f7585'; ctx.fillRect(-w/2,-h,w,9);
    ctx.fillStyle='#1f5560'; ctx.beginPath(); ctx.moveTo(-w/2-6,-h); ctx.lineTo(w/2+6,-h); ctx.lineTo(w/2+6,-h-12); ctx.lineTo(-w/2-6,-h-4); ctx.closePath(); ctx.fill();
    // deski surfingowe oparte
    [['#ff6b6b',-30],['#ffd43b',-14],['#8bc34a',2]].forEach(([c,dx],i)=>{ ctx.save(); ctx.translate(dx,-6); ctx.rotate(-0.25);
      ctx.fillStyle=c; rr(-5,-52,10,52,5); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(-1,-50,2,48); ctx.restore(); });
  } else { // snack
    const w=90,h=58;
    ctx.fillStyle='#e9d7b0'; rr(-w/2,-h,w,h,5); ctx.fill();
    for(let i=0;i<5;i++){ ctx.fillStyle=i%2?'#ffd43b':'#e0564e'; ctx.fillRect(-w/2+i*(w/5),-h-12,w/5,12); }
    ctx.fillStyle='#8a6b4a'; ctx.fillRect(-w/2+8,-h+12,w-16,24);
  }
}

const ZOOM = 1.18; // przybliżenie kamery — postacie wypełniają kadr, mniej pustego nieba
function draw(){
  ctx.save();
  ctx.translate(OX, 0);
  if(shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  // ---- ŚWIAT (zoom bazowy + uderzeniowy zoom + delikatny dryf kamery za graczem) ----
  ctx.save();
  const z = ZOOM + camPunch;
  // kamera jedzie za Gregiem przez cały kurort, z lekkim wyprzedzeniem w stronę biegu
  const half = (VW/2)/z;
  if(state === 'story'){ camX = 0; }
  else if(player){
    const look = state==='fight' ? player.moveVx*20 : 0;
    const cx = Math.max(half, Math.min(WORLD_W - half, player.x + look));
    camX += (cx - W/2 - camX) * 0.12;
  }
  viewL = camX + W/2 - (W/2 + OX)/z;
  viewR = camX + W/2 + (VW - OX - W/2)/z;
  ctx.translate(W/2, GROUND+18); ctx.scale(z, z); ctx.translate(-W/2 - camX, -(GROUND+18));
  drawScene();

  // plansze fabularne
  if(state==='story'){
    // obsada plansz fabularnych stoi w stałych miejscach kadru, nie w świecie
    const realGX = girl.x, realPX = player.x;
    girl.x = storyCast.girlX; drawGirl(); girl.x = realGX;
    if(storyIdx===1 && gosia){ // przedstawienie pani Gosi i jej jedynej zasady
      gosia.shown = true; gosia.x = 330; gosia.facing = 1; gosia.pose = 'point';
      drawGosia();
      gosia.shown = false;
    }
    if(storyIdx>=2 && storyCast){
      drawStick(storyCast.arek);
      for(const e of storyCast.mobs) drawStick(e);
    }
    if(storyIdx>=3){ player.x = storyCast.playerX; drawStick(player); player.x = realPX; }
    if(storyIdx>=4){ // wystawka arsenału — nad panelem fabuły, żeby nic nie zasłaniało
      ctx.textAlign='center';
      [[170,'noodle'],[330,'umbrella'],[490,'flipflop'],[650,'bucket']].forEach(([dx,wk])=>{
        const w = WEAPONS[wk];
        const by = 280 - Math.abs(Math.sin(time*3 + dx*0.01))*7;
        ctx.save(); ctx.globalAlpha = 0.45;
        const gr = ctx.createRadialGradient(dx, by-9, 0, dx, by-9, 34);
        gr.addColorStop(0, w.col); gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(dx, by-9, 34, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.font='32px Arial'; ctx.fillText(w.icon, dx, by);
        ctx.font='800 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial'; ctx.lineJoin='round';
        ctx.lineWidth=4.5; ctx.strokeStyle='rgba(0,0,0,.8)'; ctx.strokeText(w.name, dx, by+24);
        ctx.fillStyle=w.col; ctx.fillText(w.name, dx, by+24);
      });
    }
    ctx.restore();      // koniec zoomu
    drawStoryPanel();   // panel UI w normalnej skali
    ctx.restore();
    return;
  }

  // dziewczyna (nie rysuj w basenie podczas lose — stoi z boku przerażona)
  drawGirl();

  // wrogowie
  for(const e of enemies){
    if(e.pooledSunk){
      // czarna głowa zbira dryfuje w basenie
      const hy = POOL.top + 32 + Math.sin(time*2.1 + e.x*0.05)*3;
      ctx.strokeStyle='#111'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.arc(e.x, hy, 9, 0, Math.PI*2); ctx.stroke();
      continue;
    }
    if(e.pooled){ drawStick(e); continue; }
    if(e.dead && state==='fight'){ // KO leżący + gwiazdki, powoli znika
      const fade = Math.max(0, 1 - e.koT/2.4);
      ctx.save(); ctx.globalAlpha = 0.55*fade; drawStick(e); ctx.restore();
      ctx.save(); ctx.globalAlpha = fade;
      ctx.translate(e.x, GROUND - 30*e.scale); ctx.font='13px Arial'; ctx.textAlign='center';
      for(let i=0;i<3;i++){ const a = time*4 + i*2.1; ctx.fillText('⭐', Math.cos(a)*15*e.scale, Math.sin(a)*5 - 4); }
      ctx.restore();
    } else {
      drawStick(e);
      if(e.pose === 'ready'){ // zapowiedź techniki — pulsujący krąg pod nogami, gracz ma czas zareagować
        const pulse = 0.35 + 0.65*Math.abs(Math.sin(time*16));
        ctx.save(); ctx.globalAlpha = pulse;
        ctx.strokeStyle = (SPECIALS[e.etype] && SPECIALS[e.etype].col) || '#fff'; ctx.lineWidth = 3.5;
        ctx.beginPath(); ctx.ellipse(e.x, GROUND+2, 36*e.scale, 11*e.scale, 0, 0, Math.PI*2); ctx.stroke();
        ctx.restore();
      }
      if(e.frozen > 0){ // zamrożony lodem z wiaderka
        ctx.font='16px Arial'; ctx.textAlign='center';
        ctx.globalAlpha = 0.6 + 0.4*Math.sin(time*8);
        ctx.fillText('❄️', e.x, e.y - 108*e.scale);
        ctx.globalAlpha = 1;
      }
    }
  }
  // pani Gosia (finał)
  if(state==='win') drawGosia();
  // gracz
  const gregInWater = (state==='lose' && cut && ['sunk','girlGrab','girlLift','girlThrow','girlSunk'].includes(cut.phase))
                   || (state==='win' && cut && (cut.phase==='gosiaSunk' || (cut.phase==='end' && cut.inPool)));
  if(gregInWater){
    // tylko głowa Grega nad wodą
    ctx.save();
    ctx.strokeStyle='#f5f5f5'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(player.x, player.y, 10, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#e11'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(player.x-10, player.y-3); ctx.lineTo(player.x+10, player.y-3); ctx.stroke();
    ctx.restore();
    nameTag('GREG', player.x, POOL.top - 12, '#fff');
  } else {
    // afterimages (smugi ruchu) — świetliste duchy za Gregiem
    for(const g of trail){
      ctx.save(); ctx.globalAlpha = Math.max(0, g.life/0.2) * 0.32;
      drawStick(g); ctx.restore();
    }
    drawStick(player);
  }

  // porażenie prądem — łuki z packi pani Gosi prosto w Grega
  if(state==='win' && cut && cut.phase==='gosiaZap'){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const sx = gosia.x + 54, sy = GROUND - 98;
    const tx = player.x - 8, ty = GROUND - 66;
    for(let i=0;i<3;i++)
      drawLightning(sx, sy, tx + (Math.random()-0.5)*28, ty + (Math.random()-0.5)*44, 7, 18, 'rgba(185,235,255,0.95)', 3.2);
    drawLightning(sx, sy, tx, ty, 6, 9, 'rgba(255,255,255,0.95)', 1.5);
    ctx.restore();
  }

  // dymki oświadczyn po zwycięstwie
  if(state==='win' && cut && ['kneel','yes'].includes(cut.phase)){
    bubble(player.x, GROUND - 152, '💍 Natalka… will you marry me?');
    if(cut.phase !== 'kneel') bubble(girl.x, GROUND - 198, 'YES! YES! ❤️');
  }
  // dymki finału z panią Gosią
  if(state==='win' && cut && cut.phase==='gosiaWarn')
    bubble(gosia.x, GROUND - 150, '📣 THAT WAS YOUR EIGHTH, GREG.');
  if(state==='win' && cut && ['gosiaSunk','end'].includes(cut.phase) && cut.inPool){
    bubble(gosia.x, GROUND - 150, '✅ Rules are rules, Greg.');
    bubble(girl.x, GROUND - 200, 'I still said yes! 💍');
  }

  // błyski uderzeń — świetlna poświata + biały rozbłysk (additive)
  ctx.globalCompositeOperation = 'lighter';
  for(const h of hitFx){
    const k = Math.max(0, h.life/0.22);
    const g = ctx.createRadialGradient(h.x,h.y,0,h.x,h.y,h.r*2.4);
    g.addColorStop(0,'rgba(255,255,220,'+(0.55*k).toFixed(2)+')');
    g.addColorStop(0.5,'rgba(255,190,80,'+(0.28*k).toFixed(2)+')');
    g.addColorStop(1,'rgba(255,160,40,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(h.x,h.y,h.r*2.4,0,Math.PI*2); ctx.fill();
    // pierścień uderzenia
    ctx.strokeStyle='rgba(255,255,255,'+(0.7*k).toFixed(2)+')'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(h.x,h.y,h.r,0,Math.PI*2); ctx.stroke();
  }
  // ślady technik karate i zamachów bronią
  for(const w of wfx){
    const k = Math.max(0, w.life / 0.34), s = w.s || 1;
    ctx.save(); ctx.translate(w.x, w.y); ctx.scale(w.f || 1, 1);
    ctx.strokeStyle = w.col; ctx.lineCap = 'round'; ctx.globalAlpha = k;
    if(w.t === 'upperFx'){                      // pióropusz w górę za pięścią
      ctx.lineWidth = 5*s;
      ctx.beginPath(); ctx.arc(16*s, -14*s, 42*s, -1.5, 0.35); ctx.stroke();
      ctx.lineWidth = 2.5*s;
      ctx.beginPath(); ctx.arc(16*s, -14*s, 56*s, -1.35, 0.1); ctx.stroke();
    } else if(w.t === 'spinFx'){                // pełny okrąg wokół gracza
      ctx.lineWidth = 6*s;
      ctx.beginPath(); ctx.ellipse(0, -52*s, 96*s*(1.15-k*0.15), 26*s, 0, 0, Math.PI*2); ctx.stroke();
      ctx.lineWidth = 2.5*s; ctx.globalAlpha = k*0.6;
      ctx.beginPath(); ctx.ellipse(0, -52*s, 116*s, 32*s, 0, 0, Math.PI*2); ctx.stroke();
    } else if(w.t === 'sweepFx'){               // nisko przy deskach
      ctx.lineWidth = 5*s;
      ctx.beginPath(); ctx.arc(0, -8*s, 88*s, -0.5, 0.5); ctx.stroke();
    } else if(w.t === 'flyFx'){                 // smugi pędu
      ctx.lineWidth = 4*s; ctx.globalAlpha = k*0.8;
      for(let i=0;i<3;i++){ const yy = -34*s - i*20*s;
        ctx.beginPath(); ctx.moveTo(-18*s, yy); ctx.lineTo(-18*s - (40 + i*14)*s, yy); ctx.stroke(); }
    } else if(w.t === 'wSweep'){                // szeroki zamach makaronem
      ctx.lineWidth = 9*s; ctx.globalAlpha = k*0.75;
      ctx.beginPath(); ctx.arc(6*s, 0, 118*s, -1.0, 0.7); ctx.stroke();
      ctx.lineWidth = 3.5*s; ctx.strokeStyle = '#fff'; ctx.globalAlpha = k*0.5;

      if(kioskMsgT > 0){
        ctx.globalAlpha = Math.min(1, kioskMsgT);
        ctx.fillStyle='#fff'; ctx.font='800 13px '+F;
        ctx.fillText(kioskMsg, W/2, ky-10);
        ctx.globalAlpha = 1;
      }
    }
    // strzałka „idź dalej" po wyczyszczeniu terenu
    if(areaPhase === 'clear' && !(ar && ar.boss)){
      const pulse = 0.55 + 0.45*Math.sin(goArrowT*6);
      ctx.globalAlpha = pulse;
      ctx.fillStyle='#8bc34a'; ctx.font='900 40px '+F;
      ctx.fillText('▶▶', W-70, H/2);
      ctx.font='800 13px '+F; ctx.fillStyle='#dfffcf';
      ctx.fillText('KEEP GOING', W-70, H/2+24);
      ctx.globalAlpha = 1;
    }
    // bariera areny — widać, że dalej nie przejdziesz, póki nie posprzątasz
    if(areaPhase === 'fight' && ar){
      const sx2 = W/2 + (ar.x1 + 26 - camX - W/2)*(ZOOM+camPunch);
      if(sx2 > -OX && sx2 < VW-OX){
        ctx.save();
        ctx.globalAlpha = 0.5 + 0.2*Math.sin(time*4);
        ctx.strokeStyle='#ff5252'; ctx.lineWidth=4; ctx.setLineDash([14,12]);
        ctx.beginPath(); ctx.moveTo(sx2, 60); ctx.lineTo(sx2, H-40); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle='#ff5252'; ctx.font='800 12px '+F;
        ctx.save(); ctx.translate(sx2-14, H/2); ctx.rotate(-Math.PI/2);
        ctx.fillText('CLEAR THE AREA', 0, 0); ctx.restore();
        ctx.restore();
      }
    }
    // pasek HP bossa (Mr Arek)
    if(arek && !arek.dead && enemies.includes(arek)){
      const bx=W/2-180, bw=360, by=H-32;
      rr(bx-6, by-8, bw+12, 32, 14);
      ctx.fillStyle='rgba(10,14,30,.65)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.15)'; ctx.lineWidth=1.2; ctx.stroke();
      rr(bx, by, bw, 14, 7); ctx.fillStyle='rgba(255,60,60,.15)'; ctx.fill();
      const bf=Math.max(0, arek.hp/arek.maxHp);
      if(bf>0){
        rr(bx, by, Math.max(12,bw*bf), 14, 7);
        const bg=ctx.createLinearGradient(bx,0,bx+bw,0);
        bg.addColorStop(0,'#ff2020'); bg.addColorStop(1,'#ff7b00');
        ctx.fillStyle=bg; ctx.fill();
      }
      ctx.fillStyle='#fff'; ctx.font='800 12px '+F; ctx.textAlign='center';
      ctx.fillText('💀 MR AREK 💀', W/2, by-12);
    }
  }

  ctx.textAlign='center';
  if(state==='win' && cut && cut.phase==='end'){
    if(cut.inPool)
      overlay('💍 SHE SAID YES… 💦', 'Seven warnings over the tannoy. The eighth one Pani Gosia delivered in person. Rules are rules. ⚡🦵', 'Tap or press R to play again');
    else
      overlay('💍 SHE SAID YES! 💍', 'Eight fights across her resort — and Pani Gosia only grazed him. Greg got off lightly. ⚡', 'Tap or press R to play again');
  } else if(state==='lose' && cut && cut.phase==='girlSunk' && cut.t>0.6){
    overlay('💀 GREG, YOU LOSER! 💀', 'They threw Natalka into the water and you failed to protect her! 🌊', 'Tap or press R to try again');
  } else if(state==='lose' && cut && cut.phase==='gloat' && cut.t>1.2){
    overlay('💀 DOWN ON THE DECK 💀', 'Mr Arek left you flat at ' + (AREAS[wave] ? AREAS[wave].name : 'the resort') + '. His crew is walking on to the pool — to Natalka.', 'Tap or press R to try again');
  }
  if(paused) overlay('⏸ PAUSED', 'Greg is catching his breath…', 'Press P to resume');

  ctx.restore();
}

function overlay(big, mid, small){
  ctx.fillStyle='rgba(8,10,24,.6)'; ctx.fillRect(-OX,0,VW,H);
  const cw=600, ch=200, cx=W/2-cw/2, cy=H/2-118;
  rr(cx, cy, cw, ch, 22);
  ctx.fillStyle='rgba(18,24,48,.85)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1.5; ctx.stroke();
  rr(cx, cy, cw, 4, 2); ctx.fillStyle='#ffd43b'; ctx.fill();
  ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='900 40px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
  ctx.fillText(big, W/2, cy+74);
  ctx.font='600 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial'; ctx.fillStyle='#ffd43b';
  wrapText(mid, W/2, cy+114, cw-70, 26); // textAlign=center → linie wyśrodkowane
  ctx.font='500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
  ctx.fillStyle='rgba(255,255,255,'+(0.55+0.35*Math.sin(time*4)).toFixed(2)+')';
  ctx.fillText(small, W/2, cy+ch-26);
}

function drawStoryPanel(){
  const sl = STORY[Math.min(storyIdx, STORY.length-1)];
  const vg = ctx.createLinearGradient(0, H-220, 0, H);
  vg.addColorStop(0,'rgba(8,10,24,0)'); vg.addColorStop(1,'rgba(8,10,24,.8)');
  ctx.fillStyle=vg; ctx.fillRect(-OX, H-220, VW, 220);
  const cw=660, ch=112, cx=W/2-cw/2, cy=H-158;
  rr(cx, cy, cw, ch, 18);
  ctx.fillStyle='rgba(16,22,44,.85)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=1.4; ctx.stroke();
  ctx.textAlign='left';
  ctx.fillStyle='#ffd43b'; ctx.font='800 20px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
  ctx.fillText(sl.t, cx+26, cy+34);
  ctx.fillStyle='#e8ecff'; ctx.font='500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
  wrapText(sl.s, cx+26, cy+60, cw-52, 21);
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,'+(0.5+0.4*Math.sin(time*4)).toFixed(2)+')';
  ctx.font='600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial';
  ctx.fillText('TAP or press any key ▸   ' + (Math.min(storyIdx,STORY.length-1)+1) + ' / ' + STORY.length, W/2, cy+ch+26);
  if(storyIdx===0){
    ctx.font='900 56px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial'; ctx.lineJoin='round';
    ctx.lineWidth=10; ctx.strokeStyle='rgba(0,0,0,.45)';
    ctx.strokeText('GREG & THE RAMS', W/2, 150);
    const tg=ctx.createLinearGradient(W/2-280,0,W/2+280,0);
    tg.addColorStop(0,'#ffd43b'); tg.addColorStop(0.5,'#ff9c00'); tg.addColorStop(1,'#ff5fa2');
    ctx.fillStyle=tg; ctx.fillText('GREG & THE RAMS', W/2, 150);
    ctx.font='600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial'; ctx.fillStyle='#fff';
    ctx.fillText('— blast the rams, free Natalka 💥 —', W/2, 182);
  }
}

init();
showMenu(); // najpierw wybór trudności
requestAnimationFrame(loop);
</script>
