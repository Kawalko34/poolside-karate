<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0e1e">
<title>Greg &amp; The Rams</title>
<style>
  html{overscroll-behavior:none;}
  body{margin:0;background:linear-gradient(160deg,#111433 0%,#0b0e1e 55%,#141b3d 100%);display:flex;flex-direction:column;align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:#fff;min-height:100vh;
    overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
  body.touchmode{position:fixed;inset:0;width:100%;}
  h1{margin:16px 0 4px;letter-spacing:4px;font-weight:800;font-size:clamp(15px,4.6vw,26px);white-space:nowrap;max-width:100vw;overflow:hidden;
    background:linear-gradient(90deg,#ffd43b,#ff9c00 40%,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(255,156,0,.35));}
  @media (max-width:600px){ h1{font-size:14px;letter-spacing:2px;} #hint{display:none;} }
  #info{color:#8fa3d9;font-size:13px;margin-bottom:12px;letter-spacing:.3px;}
  #info b{color:#dfe7ff;font-weight:600;}
  canvas{background:#87ceeb;border-radius:16px;box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.08);
    width:min(960px,98vw);height:auto;touch-action:none;}
  #hint{color:#55618a;font-size:12px;margin-top:10px;}
  #touch{display:none;position:fixed;left:0;right:0;bottom:10px;z-index:9;justify-content:space-between;padding:0 8px;pointer-events:none;}
  .tgroup{display:flex;gap:8px;}
  .tbtn{pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(18,24,48,.42);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1.5px solid rgba(255,255,255,.35);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18);
    user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .08s ease,background .08s ease;}
  .tbtn:active{background:rgba(255,255,255,.34);transform:scale(.9);}
  .tbtn-gas{width:78px;height:78px;font-size:30px;background:rgba(150,180,90,.42);border-color:rgba(214,230,150,.6);}
  .tbtn-gasup{font-size:21px;letter-spacing:-3px;background:rgba(120,170,210,.42);border-color:rgba(170,215,255,.6);}
  body.touchmode #touch .tbtn-gas{width:74px;height:74px;font-size:32px;}
  body.touchmode #touch .tbtn-gasup{font-size:22px;}
  body.touchmode #touch{display:flex;}
  body.touchmode #info{display:none;}
  #topbtns{display:none;position:fixed;top:calc(6px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:11;gap:8px;}
  body.touchmode #topbtns{display:flex;}
  #topbtns .tbtn{width:44px;height:44px;font-size:19px;}
  /* iPhone / dotyk: gra na cały ekran, canvas dopasowany, przyciski na wierzchu */
  body.touchmode{justify-content:flex-start;min-height:100vh;min-height:100dvh;overflow:hidden;padding:0;}
  body.touchmode h1{display:none;}
  body.touchmode #hint{display:none;}
  /* przyciski w osobnym pasku POD grą — nigdy nie zasłaniają akcji */
  body.touchmode canvas{width:100vw;height:calc(100dvh - 60px - env(safe-area-inset-bottom));max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none;}
  body.touchmode #touch{bottom:0;background:rgba(8,10,24,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-top:1px solid rgba(255,255,255,.14);
    padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));}
  body.touchmode .tgroup{gap:7px;}
  body.touchmode #touch .tbtn{width:54px;height:54px;font-size:21px;}
  @media (orientation:portrait) and (max-width:900px){
    body.touchmode #rotate{display:flex;}
  }
  #rotate{display:none;position:fixed;inset:0;z-index:20;background:#12121f;color:#fff;
    flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:20px;gap:14px;}
  #rotate .big{font-size:52px;animation:spin 2s ease-in-out infinite;}
  @keyframes spin{0%,100%{transform:rotate(-90deg)}50%{transform:rotate(0deg)}}
  /* ekran wyboru trudności */
  #diffmenu{display:none;position:fixed;inset:0;z-index:30;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;text-align:center;padding:20px;
    background:radial-gradient(circle at 50% 30%,rgba(30,40,80,.92),rgba(8,10,24,.96));
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .dm-title{font-size:clamp(20px,5vw,34px);font-weight:900;letter-spacing:1px;
    background:linear-gradient(90deg,#ffd43b,#ff9c00 45%,#ff5fa2);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .dm-btns{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
  .dm{cursor:pointer;width:190px;padding:20px 16px;border-radius:18px;border:2px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.06);color:#fff;display:flex;flex-direction:column;gap:8px;align-items:center;
    transition:transform .1s ease,background .1s ease,border-color .1s ease;-webkit-tap-highlight-color:transparent;}
  .dm b{font-size:26px;font-weight:900;letter-spacing:1px;}
  .dm span{font-size:12.5px;color:#aebbe0;font-weight:500;}
  .dm:nth-child(1) b{color:#8bc34a;} .dm:nth-child(2) b{color:#ffd43b;} .dm:nth-child(3) b{color:#ff5252;}
  .dm:hover,.dm:active{transform:translateY(-4px) scale(1.04);background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.5);}
  .dm-hint{font-size:13px;color:#6b78a6;}
  @media (max-width:560px){ .dm{width:150px;padding:14px 10px;} .dm b{font-size:21px;} }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="topbtns">
  <div class="tbtn" data-act="pause">⏸</div>
  <div class="tbtn" data-act="music">🎵</div>
  <div class="tbtn" data-act="restart">🔄</div>
</div>
<div id="touch">
  <div class="tgroup">
    <div class="tbtn" data-k="arrowleft">◀</div>
    <div class="tbtn" data-k="arrowright">▶</div>
    <div class="tbtn" data-k="w">⬆</div>
  </div>
  <div class="tgroup">
    <div class="tbtn" data-k="s">🛡️</div>
    <div class="tbtn tbtn-gas tbtn-gasup" data-k="u" title="Gas up">💨⬆</div>
    <div class="tbtn tbtn-gas" data-k="j" title="Gas forward">💨</div>
  </div>
</div>
<div id="hint">You are Greg in a cheerleader dress 💙 — blast every ram and free Natalka! Watch out for Ms Gosia.</div>
<div id="rotate"><div class="big">📱</div><div>Rotate your phone<br>to play 🥋</div></div>
<div id="diffmenu">
  <div class="dm-title">📣 GREG &amp; THE RAMS 💨</div>
  <div class="dm-btns">
    <button class="dm" data-d="normal"><b>▶ PLAY</b><span>Blast the rams &middot; free Natalka</span></button>
  </div>
  <div class="dm-hint">tap PLAY &nbsp;·&nbsp; or press Enter / Space</div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540;
// retina: rysuj w wyższej rozdzielczości, wyświetlaj przez CSS
const DPR = Math.min(2, window.devicePixelRatio || 1);
let VW = W, OX = 0; // na telefonie widok poszerzony do proporcji ekranu (pełny ekran bez pasów)
function fitViewport(){
  if(touchUI){
    // mierz realny box canvasu (CSS: 100vw × wysokość ekranu minus pasek przycisków)
    const r = cv.getBoundingClientRect();
    const cw = r.width || (window.innerWidth||W);
    const chh = Math.max(120, r.height || (window.innerHeight||H));
    const aspect = Math.min(3.2, Math.max(16/9, cw / chh));
    VW = Math.round(H * aspect);
    OX = Math.round((VW - W) / 2);
  } else { VW = W; OX = 0; }
  cv.width = VW*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
const GROUND = 470;
// cały kurort w jednej, długiej planszy — Greg idzie z promenady aż nad basen
const WORLD_W = 5700;
const POOL = {x: 5340, w: 300, top: GROUND - 6, depth: 60};
const WORLD_MIN_X = 40;
const WORLD_MAX_X = POOL.x - 15;
let camX = 0;

// fabuła + tryb dotykowy (deklaracje wcześnie — używane w kodzie startowym)
let storyIdx = 0, storyLast = 0, storyCast = null, touchUI = false;
const STORY = [
  {t:'GREG & THE RAMS',  s:'A hot afternoon at Palm Cove. Greg is walking the length of the resort with a ring in his pocket and one plan: ask Natalka by the water, at the deep end, before sunset.'},
  {t:'THE HOUSE RULES',  s:'Ms Gosia runs Palm Cove. One rule, printed on every sign: ABSOLUTELY NO FIGHTING. She patrols with a whistle, a clipboard — and an electric fly swatter.'},
  {t:'THEY TAKE THE RESORT', s:'Mr Arek’s crew sweep in and take the place — boardwalk, bar, cabins, the lot. They corner Natalka at the deep end. “Nobody reads at MY pool.”'},
  {t:'ONE HERO STANDS',  s:'Greg is at the far gate. Eight places between him and her. He could go and find a lifeguard. He rolls up his sleeves instead.'},
  {t:'FIGHT YOUR WAY EAST', s:'Walk right. Clear each place to open the way. Take what the deck gives you — noodles, umbrellas, flip-flops, ice buckets — and every coin the crew drops. Ms Gosia is listening.'}
];

// ---------- audio ----------
let AC = null;
function unlockAudio(){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
  }catch(e){}
}
function beep(freq, dur, type='square', vol=0.08, slide=0){
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), AC.currentTime+dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sndPunch = ()=>beep(160,0.08,'square',0.1,-80);
const sndKick  = ()=>beep(110,0.14,'sawtooth',0.12,-60);
const sndHurt  = ()=>beep(300,0.12,'triangle',0.1,-200);
const sndSplash= ()=>{beep(600,0.4,'sawtooth',0.06,-500);beep(200,0.5,'triangle',0.08,-150);};
const sndWin   = ()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.08),i*140));};
const sndLose  = ()=>{[400,350,300,200].forEach((f,i)=>setTimeout(()=>beep(f,0.25,'sawtooth',0.08),i*180));};

// ---------- muzyka ----------
let musicOn = true, musicStep = 0;
// progresja akordów Am – F – C – G (8 kroków każdy), pełniejsza pętla 32-krokowa
const CHORDS = [
  {root:110, tones:[220,261.6,329.6]},   // Am
  {root:87.3, tones:[174.6,220,261.6]},  // F
  {root:130.8, tones:[261.6,329.6,392]}, // C
  {root:98, tones:[196,246.9,293.7]}     // G
];
function kick(){ beep(125,0.13,'sine',0.13,-95); beep(60,0.09,'triangle',0.08,-30); }
function snare(){ beep(1900,0.05,'square',0.028,-400); beep(240,0.06,'sawtooth',0.03,-120); }
function hat(o){ beep(o?7000:5200,0.02,'square',o?0.016:0.01); }
setInterval(()=>{
  if(!musicOn || !AC || state!=='fight' || paused || document.hidden) return;
  const step = musicStep % 32, ch = CHORDS[(musicStep>>3) % 4], beat = step % 4;
  // bas — root + kwinta w rytmie
  if(beat===0) beep(ch.root, 0.15, 'triangle', 0.05);
  else if(beat===2) beep(ch.root*1.5, 0.12, 'triangle', 0.04);
  // arpeggio melodii
  const l = ch.tones[(musicStep) % 3] * (step>=16?2:1);
  if(step % 2 === 0) beep(l, 0.12, 'square', 0.024);
  // perkusja: stopa four-on-floor, werbel na 2 i 4, hi-hat co krok
  if(beat===0) kick();
  if(beat===2) snare();
  hat(step % 2 === 1);
  musicStep++;
}, 150);

// ---------- input ----------
const keys = {};
function anyKeyAction(){
  if(state==='story' && Date.now() - storyLast > 350){
    storyLast = Date.now();
    storyIdx++;
    if(storyIdx >= STORY.length) state = 'fight';
  }
}
addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  // ekran startowy — dowolny klawisz akcji startuje grę (tylko jeden poziom: NORMAL)
  if(typeof diffMenuEl !== 'undefined' && diffMenuEl.style.display !== 'none' && diffMenuEl.style.display !== ''){
    if(k==='enter' || k===' ' || k==='1' || k==='2' || k==='3') chooseDiff('normal');
    return;
  }
  keys[k] = true;
  if(['arrowleft','arrowright','arrowup',' '].includes(k)) e.preventDefault();
  anyKeyAction();
  if(k==='m') musicOn = !musicOn;
  if(k==='p' && state==='fight') paused = !paused;
  if(k==='r'){ paused = false; showMenu(); }
});
addEventListener('keyup', e=>keys[e.key.toLowerCase()] = false);

// odblokuj audio na iOS/Android przy pierwszym geście
['pointerdown','touchstart','keydown'].forEach(ev=>
  addEventListener(ev, unlockAudio, {once:false, passive:true}));

// sterowanie dotykowe
if(('ontouchstart' in window) || navigator.maxTouchPoints > 0 || location.search.includes('touch=1')){
  document.body.classList.add('touchmode');
  touchUI = true;
}
fitViewport();
addEventListener('resize', fitViewport);
addEventListener('orientationchange', ()=>setTimeout(fitViewport, 200));
// blokuj gesty przewijania/zoomu na urządzeniach dotykowych
addEventListener('touchmove', e=>{ if(document.body.classList.contains('touchmode')) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());
addEventListener('dblclick', e=>e.preventDefault());
document.querySelectorAll('.tbtn').forEach(b=>{
  const k = b.dataset.k;
  const on = e=>{ e.preventDefault(); keys[k] = true; anyKeyAction(); };
  const off = e=>{ e.preventDefault(); keys[k] = false; };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
});
// tap w canvas = przewiń fabułę / po końcu gry wróć do wyboru trudności
cv.addEventListener('pointerdown', ()=>{
  if(state==='story') anyKeyAction();
  else if((state==='win' && cut && cut.phase==='end') || (state==='lose' && cut && ['girlSunk','gloat'].includes(cut.phase))) showMenu();
});
// ekran wyboru trudności
const diffMenuEl = document.getElementById('diffmenu');
function showMenu(){ paused = false; menuOpen = true; diffMenuEl.style.display = 'flex'; }
function hideMenu(){ menuOpen = false; diffMenuEl.style.display = 'none'; }
function chooseDiff(key){ if(!DIFFS[key]) return; unlockAudio(); diff = DIFFS[key]; hideMenu(); init(); }
document.querySelectorAll('#diffmenu .dm').forEach(b=>{
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); chooseDiff(b.dataset.d); });
});
// górne przyciski (pauza / muzyka / restart)
document.querySelectorAll('#topbtns .tbtn').forEach(b=>{
  b.addEventListener('pointerdown', e=>{
    e.preventDefault(); unlockAudio();
    const a = b.dataset.act;
    if(a==='pause'){ if(state==='fight') paused = !paused; }
    else if(a==='music'){ musicOn = !musicOn; b.style.opacity = musicOn ? '1' : '0.4'; }
    else if(a==='restart'){ showMenu(); }
  });
});

// ---------- fighters ----------
const CHAR_SCALE = 1.12; // naturalny rozmiar postaci (nie za duże)
function mkFighter(x, opts){
  const f = Object.assign({
    x, y: GROUND, vx:0, vy:0, onGround:true,
    facing:1, scale:1, color:'#111', beltColor:null,
    hp:30, maxHp:30, dmgPunch:6, dmgKick:10, speed:1.6,
    pose:'idle', poseT:0, attackCd:0, hurtT:0, dead:false, invuln:0, blocking:false, ranged:false,
    walkT:0, rot:0, carried:false, isArek:false, name:'', pooled:false, pooledSunk:false,
    mass:1, cdBase:1.3, specialCd:0, slamAir:false, squash:0, moveVx:0,
    weapon:null, wUses:0, frozen:0,
    role:'waiter', side:0, strafeT:0, strafeDir: Math.random()<0.5 ? -1 : 1,
    chain:0, chainKind:'', chainT:0, knockT:0, spec:null, specT:0, tellT:0, specHit:false,
    koT:0, stopOff: Math.random()*10
  }, opts);
  f.scale *= CHAR_SCALE;
  return f;
}

let player, enemies, arek, girl, gosia, wave, state, cut, particles, hearts, splashes, msgT, shake, time;
let score, combo, comboT, hitStop, popups, shocks, items, balls, paused = false;
let superCharge = 0, flashT = 0, hitFx = [];
let camPunch = 0, slowmo = 0, dustT = 0, dmgVig = 0, hpShown = 1, hpGhost = 1, trail = [], confetti = [], menuOpen = false;
let waterShots = [], waterCd = 0;
let gasClouds = [], gasCd = 0, gasPuffs = [], glassFlies = [];
let witches = [], pumpkins = [], pumpkinSplats = [], bats = [], floatSkulls = [], hallGlow = []; // Halloween: wiedźmy na miotłach, dynie, nietoperze
let shots = []; // pociski Grega — strzela zamiast gazu
let areaPhase = 'travel', banner = null, bannerT = 0, goArrowT = 0, coins = 0;
let spawnQueue = [], spawnT = 0, roleT = 0, wfx = [], kioskNear = null, kioskMsgT = 0, kioskMsg = '', kioskCd = 0;
let fightT = 0; // gdy walka się przeciąga, wszyscy ruszają na gracza — zabezpieczenie przed zablokowaniem
let viewL = 0, viewR = W; // widoczny wycinek świata — do parallaxu i odsiewania dekoracji
const CONF_COLS = ['#ff5252','#ffd43b','#7fd4ff','#ff5fa2','#8bc34a','#fff','#b388ff'];
function spawnConfetti(n){
  const cx0 = (player ? player.x : W/2) - W/2;   // sypie się nad graczem, nie na początku planszy
  for(let i=0;i<n;i++) confetti.push({x:cx0 + Math.random()*W, y:-10-Math.random()*40,
    vx:(Math.random()-0.5)*1.4, vy:1.5+Math.random()*2.5, rot:Math.random()*6.28, vr:(Math.random()-0.5)*0.4,
    w:4+Math.random()*4, col:CONF_COLS[Math.random()*CONF_COLS.length|0], life:3.5});
}
const store = (typeof localStorage !== 'undefined') ? localStorage : {getItem:()=>null, setItem:()=>{}};
let hiScore = parseInt(store.getItem('karateBasenHi') || '0', 10);

function addPopup(x, y, txt, color){
  popups.push({x, y, txt, color, life: 1.0, vy: -1.4});
}
function addScore(n, x, y){
  score += n * (1 + Math.min(combo, 10) * 0.1) | 0;
  if(x !== undefined) addPopup(x, y, '+' + n, '#ffd43b');
  if(score > hiScore){ hiScore = score; store.setItem('karateBasenHi', String(hiScore)); }
}

function init(){
  time = 0; shake = 0;
  state = 'fight'; storyIdx = 0;   // bez wstępu fabularnego — gra startuje od razu (panele „kwadraty z napisami" usunięte)
  particles = []; hearts = []; splashes = [];
  score = 0; combo = 0; comboT = 0; hitStop = 0; popups = []; shocks = []; items = []; balls = []; paused = false;
  superCharge = 0; flashT = 0; hitFx = []; camPunch = 0; slowmo = 0; dustT = 0; dmgVig = 0; hpShown = 1; hpGhost = 1; trail = []; confetti = [];
  waterShots = []; waterCd = 0; gasClouds = []; gasCd = 0; gasPuffs = []; glassFlies = [];
  witches = []; pumpkins = []; pumpkinSplats = []; floatSkulls = []; hallGlow = []; shots = [];
  spawnWitches();
  bats = []; for(let i=0;i<10;i++) bats.push({x:Math.random()*WORLD_W, y:70+Math.random()*120, ph:Math.random()*6.28, sp:0.4+Math.random()*0.5, sc:0.5+Math.random()*0.6});
  player = mkFighter(90, {color:'#f5f5f5', beltColor:'#111', hp:diff.php, maxHp:diff.php, facing:1, speed:3.15, name:'GREG',
    dmgPunch:14, dmgKick:20, cheer:true});
  girl = {x: POOL.x - 28, y: GROUND, panicT:0, saved:false, runT:0, yOff:0, rot:0, vx:0, vy:0, sunk:false};
  wave = 0; enemies = []; arek = null;
  areaPhase = 'travel'; bannerT = 0; banner = null; goArrowT = 0;
  spawnQueue = []; spawnT = 0; roleT = 0; wfx = [];
  kioskNear = null; kioskMsgT = 0; kioskCd = 0;
  camX = 0; coins = 0;
  items = LOOT.map(l => ({kind:l.k, w:l.w, x:l.x, t:Math.random()*3, taken:false}));
  gosia = mkGosia(300);
  cut = null; msgT = 0;
  // obsada do plansz fabularnych (rysowana w stałych miejscach ekranu, nie w świecie)
  storyCast = {
    playerX: 170, girlX: 780,
    arek: mkFighter(560, {color:'#0a0a0a', beltColor:'#c00', scale:1.75, isArek:true,
      facing:1, name:'MR AREK', pose:'punch', poseT:0.09}),
    mobs: [
      mkFighter(660, {color:'#111', beltColor:'#333', facing:1, etype:'zbir'}),
      mkFighter(716, {color:'#26323e', beltColor:'#09f', scale:0.88, facing:1, etype:'szybki'})
    ]
  };
}

// ---------- MS GOSIA — kierowniczka basenu z elektryczną packą ----------
function mkGosia(x){

// ---------- HALLOWEEN: wiedźmy na miotłach (Pani Gosia + Natalka) rzucające dyniami ----------
function spawnWitches(){
  witches = [
    {name:'GOSIA',   hat:'#2a1240', robe:'#4b1668', hair:'#e9e2d0', side:-1, baseY:120, amp:34, ph:0,    sp:0.42, throwCd:2.6, spook:0, cackle:0, hp:3},
    {name:'NATALKA', hat:'#3a0f2a', robe:'#7a1248', hair:'#3a2a1c', side: 1, baseY:150, amp:40, ph:3.1,  sp:0.5,  throwCd:3.6, spook:0, cackle:0, hp:3}
  ];
}
function updateWitches(dt){
  if(!player) return;
  const flying = (state==='fight');
  for(const w of witches){
    w.ph += dt * w.sp;
    // krąży nad graczem, po jego stronie; lekko goni gracza po X
    const targetX = player.x + w.side * (150 + Math.sin(w.ph*0.7)*90);
    w.x = (w.x==null?targetX:w.x + (targetX - w.x)*Math.min(1,dt*1.4));
    w.y = w.baseY + Math.sin(w.ph) * w.amp - (w.spook>0 ? 90*Math.min(1,w.spook) : 0);
    w.facing = Math.sign(player.x - w.x) || 1;
    if(w.spook>0){ w.spook -= dt*0.8; w.cackle=0; continue; } // ogazowana — ucieka w górę, nie rzuca
    if(w.cackle>0) w.cackle -= dt;
    // rzut dynią w stronę gracza — tylko w walce i gdy gracz w zasięgu ekranu
    if(flying){
      w.throwCd -= dt;
      const onScreen = w.x > camX-80 && w.x < camX+W+80;
      if(w.throwCd<=0 && onScreen){
        w.throwCd = 2.4 + Math.random()*2.2;
        w.cackle = 0.5;
        const tx = player.x + player.vx*8, ty = GROUND-26;
        const dxp = tx - w.x, dyp = ty - w.y;
        const tflight = 1.05;
        pumpkins.push({x:w.x, y:w.y+8, vx:dxp/tflight, vy:(dyp - 0.5*1050*tflight*tflight)/tflight,
          r:13, rot:Math.random()*6.28, vr:(Math.random()-0.5)*10, from:w.name});
      }
    }
  }
}
function updatePumpkins(dt){
  for(const p of pumpkins){
    p.vy += 1050*dt;              // grawitacja
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.rot += p.vr*dt;
    // trafienie w Grega
    if(player && player.hp>0 && !player.down){
      const dx = p.x-player.x, dy = p.y-(player.y-40);
      if(dx*dx+dy*dy < (p.r+22)*(p.r+22)){
        p.dead = true; pumpkinSplat(p.x,p.y);
        player.hp -= 10*diff.edmg; player.hurtT = 0.5; player.vx += Math.sign(player.x-p.x)*3;
        dmgVig = Math.max(dmgVig,0.6); camPunch = Math.max(camPunch,0.05); shake = Math.max(shake,8);
        addPopup(player.x, player.y-96, 'PUMPKIN! 🎃', '#ff9f43');
        if(player.hp<=0){ player.hp=0; }
      }
    }
    // uderzenie w ziemię
    if(p.y > GROUND-6){ p.dead = true; pumpkinSplat(p.x, GROUND-6); }
    if(p.x < camX-200 || p.x > camX+W+200) p.dead = true;
  }
  for(let i=pumpkins.length-1;i>=0;i--) if(pumpkins[i].dead) pumpkins.splice(i,1);
  for(const s of pumpkinSplats){ s.life -= dt; }
  for(let i=pumpkinSplats.length-1;i>=0;i--) if(pumpkinSplats[i].life<=0) pumpkinSplats.splice(i,1);
}
function pumpkinSplat(x,y){
  pumpkinSplats.push({x,y,life:0.8,max:0.8});
  for(let i=0;i<12;i++){ const a=Math.random()*6.28, s=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:0.6,color:(i%3?'#ff8c1a':'#ffd43b')}); }
}

function buyAt(slot){
  const p = player, cost = KIOSK_PRICES[slot];
  const deny = m => { kioskMsg = m; kioskMsgT = 1.5; kioskCd = 0.4; beep(160,0.16,'square',0.07,-60); };
  if(coins < cost) return deny('NOT ENOUGH COINS — ' + cost + ' NEEDED');
  if(slot === 1 && p.hp >= p.maxHp) return deny('ALREADY AT FULL HEALTH');
  if(slot === 2 && !p.weapon) return deny('NO WEAPON TO REFILL');
  coins -= cost; kioskCd = 0.5;
  if(slot === 1){ p.hp = p.maxHp; kioskMsg = '🌭 FULL HEALTH!'; }
  else if(slot === 2){ p.wUses = WEAPONS[p.weapon].uses; kioskMsg = '🔧 ' + WEAPONS[p.weapon].name + ' REFILLED!'; }
  else { const wk = WKEYS[Math.random()*WKEYS.length|0]; p.weapon = wk; p.wUses = WEAPONS[wk].uses; kioskMsg = '🎁 ' + WEAPONS[wk].name + '!'; }
  kioskMsgT = 2;
  addPopup(p.x, p.y - 152, kioskMsg, '#8bc34a');
  [880,1170,1400].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'square',0.07), i*70));
  spawnConfetti(10);
}

// reżyser: najbliżsi naciera­ją, kolejni obchodzą z boku, reszta czeka w ruchu.
// Role zmieniają się co pół sekundy, więc walka nie zastyga w jednym układzie.
function assignRoles(){
  const alive = enemies.filter(e => !e.dead && !e.pooled && !e.ranged && !e.isArek);
  alive.sort((a, b) => Math.abs(a.x - player.x) - Math.abs(b.x - player.x));
  const attackers = Math.min(2, Math.max(1, Math.round(alive.length/2)));
  alive.forEach((e, i) => {
    e.role = i < attackers ? 'attacker' : (i < attackers + 2 ? 'flanker' : 'waiter');
    // co drugi ustawia się z przeciwnej strony — gracz jest brany w kleszcze
    e.side = i % 2 === 0 ? (Math.sign(e.x - player.x) || 1) : -(Math.sign(e.x - player.x) || 1);
  });
}

// wrogowie WCHODZĄ do kadru zamiast pojawiać się gotowi: wbiegają z boku albo zeskakują z góry
function spawnNextMob(){
  const a = AREAS[wave];
  if(!a || !spawnQueue.length) return;
  const {type, i} = spawnQueue.shift();
  const fromLeft = i % 3 === 2;
  const entry = a.entry === 'mix' ? (i % 2 ? 'drop' : 'run') : (a.entry || 'run');
  let sx = fromLeft ? a.x0 - 140 : a.x1 + 140;
  sx = Math.max(WORLD_MIN_X, Math.min(WORLD_MAX_X, sx));

  if(type === 'arek'){
    arek = mkFighter(POOL.x - 90, {color:'#0a0a0a', beltColor:'#c00', scale:1.75, hp:Math.round(120*diff.ehp), maxHp:Math.round(120*diff.ehp),
      dmgPunch:Math.round(9*diff.edmg), dmgKick:Math.round(13*diff.edmg), speed:1.15*diff.espd, isArek:true, facing:-1,
      name:'MR AREK', mass:4, specialCd:5.5, role:'attacker'});
    enemies.push(arek);
    return;
  }
  const t = TYPES[type];
  const ehp = Math.round(t.hp*diff.ehp);
  const e = mkFighter(sx, {color:t.color, beltColor:t.belt, hp:ehp, maxHp:ehp,
    facing: fromLeft ? 1 : -1, speed:(t.spd[0] + Math.random()*(t.spd[1]-t.spd[0]))*diff.espd,
    dmgPunch:Math.max(1,Math.round(t.dmgP*diff.edmg)), dmgKick:Math.max(1,Math.round(t.dmgK*diff.edmg)),
    scale:t.scale, mass:t.mass, cdBase:t.cd, ranged:!!t.ranged, etype:type,
    glasses: Math.random() < 0.45,   // baran w okularach — gaz go nie bierze, póki nie zbijesz okularów
    rammer: (type==='zbir'||type==='gruby') && Math.random() < 0.5,  // baran szarżujący — pędzi i przewraca Grega
    role: 'flanker', side: fromLeft ? -1 : 1, entering: true});
  if(entry === 'drop'){                       // zeskakuje zza baru / z wieży / z kabiny
    e.x = Math.max(a.x0 + 40, Math.min(a.x1 - 40, player.x + (fromLeft ? -190 : 190)));
    e.y = GROUND - 300; e.onGround = false; e.vy = 0;
    e.pose = 'slam'; e.poseT = 0;
  }
  enemies.push(e);
  beep(fromLeft ? 300 : 380, 0.09, 'square', 0.05, 90);
}

// ---------- combat ----------
function tryAttack(a, targets, kind){
  // broń w rękach gracza: dłuższy zasięg, mocniejsze uderzenie, większy odrzut
  const wp = (a === player && a.weapon) ? WEAPONS[a.weapon] : null;
  if(wp) weaponSwingFx(a, kind, wp);
  let dmg = kind==='punch' ? a.dmgPunch : a.dmgKick;
  if(wp) dmg = Math.round(dmg * wp.dmg);
  const air = !a.onGround;
  if(air) dmg = Math.round(dmg * 1.5); // kopniak/cios w powietrzu = mocniejszy
  const range = (kind==='punch' ? 52 : 66) * a.scale * (wp ? wp.range : 1);
  let hit = false;
  for(const t of targets){
    if(t.dead || t.hp<=0 || t.invuln>0) continue;
    const dx = t.x - a.x;
    if(Math.abs(dx) < range && Math.sign(dx||1) === a.facing && Math.abs(t.y - a.y) < 80){
      const blocked = (t === player) && t.blocking && Math.sign(a.x - t.x || 1) === t.facing;
      if(blocked){
        t.hp -= Math.ceil(dmg * 0.2);
        t.invuln = 0.3;
        t.vx = a.facing * 1.5;
        burst(t.x + t.facing*18, t.y - 55, '#fff', 6);
        addPopup(t.x, t.y - 112, 'BLOCKED! 🛡️', '#9adcff');
        beep(1300, 0.06, 'square', 0.07);
        hit = true;
        if(t.hp <= 0){ t.dead = true; t.pose = 'ko'; }
        continue;
      }
      if(t.frozen > 0) dmg = Math.round(dmg * 1.5); // zamrożony = kruchy, obrywa mocniej
      t.hp -= dmg;
      t.hurtT = 0.35;
      t.vx = a.facing * (kind==='kick' ? 7 : 3.5) * (wp ? wp.knock : 1) / (t.mass || 1);
      t.pose = 'hit'; t.poseT = 0;
      const hy2 = t.y-60*t.scale;
      burst(t.x, hy2, kind==='kick' ? '#ffb300' : '#fff', 8);
      hitFx.push({x:t.x, y:hy2, r:6*t.scale, life:0.22, big:kind==='kick'}); // błysk uderzenia
      if(a === player) camPunch = Math.max(camPunch, kind==='kick'?0.045:0.03); // uderzeniowy zoom kamery
      hit = true;
      if(t === player){
        t.invuln = 0.7;
        combo = 0;
        dmgVig = 0.6; // czerwona winieta bólu
      } else if(a === player){
        combo++; comboT = 1.4;
        superCharge = Math.min(100, superCharge + (kind==='kick' ? 16 : 12));
        addScore(kind==='kick' ? 15 : 10, t.x, t.y - 90*t.scale);
        if(air) addPopup(t.x, t.y - 115*t.scale, 'AIR HIT!', '#7fd4ff');
      }
      if(t.hp <= 0){
        t.dead = true; t.pose='ko';
        if(a === player){ addScore(25, t.x, t.y - 105*t.scale); burst(t.x, t.y-50*t.scale, '#ffd43b', 14); maybeDropWeapon(t.x); dropCoins(t.x, 2 + (Math.random()<0.4 ? 1 : 0)); }
        if(t.isArek && a === player){ // kinowy nokaut bossa — slow-motion + rozbłysk
          slowmo = 1.4; camPunch = Math.max(camPunch, 0.08); flashT = Math.max(flashT, 0.2);
          shake = Math.max(shake, 14);
          hitFx.push({x:t.x, y:t.y-70*t.scale, r:20, life:0.35, big:true});
          burst(t.x, t.y-60*t.scale, '#fff', 22);
        }
      }
      // kopniak przy krawędzi = zbir wpada do basenu! (broń o dużym odrzucie sięga dalej)
      const poolEdge = POOL.x - 80 - (wp ? (wp.knock - 1) * 46 : 0);
      if(a === player && kind==='kick' && !t.isArek && t.x > poolEdge && a.facing === 1){
        t.pooled = true; t.dead = true; t.hp = 0;
        t.onGround = false; t.vx = 5; t.vy = -4.5;
        addScore(50, t.x, t.y - 120*t.scale);
        addPopup(t.x, t.y - 140*t.scale, 'INTO THE POOL! 🌊', '#7fd4ff');
      }
      hitStop = Math.max(hitStop, kind==='kick' ? 0.07 : 0.045);
    }
  }
  if(hit){
    (kind==='punch'?sndPunch:sndKick)();
    shake = Math.max(shake, kind==='kick'?5:3);
    if(wp){ beep(wp.freeze?1200:520, 0.06, 'square', 0.06); useWeapon(1); }
  }
  else (kind==='punch'?sndPunch:sndKick)();
  return hit;
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++) particles.push({x,y,vx:(Math.random()-0.5)*6,vy:-Math.random()*5,life:0.6,color});
}

// ---------- broń: zużycie, upuszczanie, rzut klapkiem, mrożenie ----------
function useWeapon(n){
  const p = player;
  if(!p.weapon) return;
  const w = WEAPONS[p.weapon];
  p.wUses -= (n || 1);
  if(p.wUses === 3){                       // ostrzeżenie, zanim broń pęknie
    addPopup(p.x, p.y - 150, '⚠️ ' + w.name + ' — 3 LEFT', '#ffab00');
    beep(420, 0.09, 'square', 0.06, -120);
  }
  if(p.wUses <= 0){
    addPopup(p.x, p.y - 150, '💥 ' + w.name + ' BROKE!', '#ff5252');
    beep(210, 0.22, 'sawtooth', 0.09, -130);
    for(let i=0;i<12;i++)

function sprayGas(p, forceUp){

  p.pose = 'shoot'; p.poseT = 0;

  if(up){
    const diagH = (keys['arrowleft']||keys['a']) ? -1 : (keys['arrowright']||keys['d']) ? 1 : 0;
    if(diagH!==0){ p.facing = diagH; vx = diagH*SP*0.62; vy = -SP*0.82; }  // skos
    else { vx = p.facing*SP*0.12; vy = -SP; }                              // prosto w górę
    mx = p.x + Math.sign(vx||p.facing)*12; my = p.y - 72*p.scale; isUp = true;
    if(!p.onGround) p.vy += 0.5;
  } else {
    p.moveVx -= p.facing * 0.8;          // lekki odrzut
    vx = p.facing*SP; vy = -40;          // lekki łuk
    mx = p.x + p.facing*28*p.scale; my = p.y - 56*p.scale;
  }
  shots.push({x:mx, y:my, vx, vy, r:7, life:0.95, up:isUp, hit:false, trail:[]});
  // błysk z wylotu
  for(let i=0;i<5;i++) particles.push({x:mx, y:my, vx:(vx/120)+(Math.random()-0.5)*2, vy:(vy/160)+(Math.random()-0.5)*2, life:0.22, color:'rgba(180,235,255,0.9)'});

}

// lot i trafienia pocisków Grega
function updateShots(dt){
  for(const s of shots){
    s.trail.push({x:s.x, y:s.y}); if(s.trail.length>6) s.trail.shift();
    s.vy += 900*dt;                      // grawitacja (łagodny łuk)
    s.x += s.vx*dt; s.y += s.vy*dt;
    s.life -= dt;
    if(s.hit){ continue; }
    // barany: okularnikowi najpierw zbijamy okulary, potem obrywa
    for(const e of enemies){
      if(e.dead || e.pooled || e.frozen>0) continue;
      const dx = e.x - s.x, dy = (e.y - 46*e.scale) - s.y;
      if(dx*dx + dy*dy < (s.r + 26*e.scale)*(s.r + 26*e.scale)){
        if(e.glasses){
          e.glasses = false;
          glassFlies.push({x:e.x, y:e.y-62*e.scale, vx:(e.x>s.x?2:-2)+(Math.random()-0.5), vy:-3-Math.random(), rot:0, vr:0.3, life:1.1});
          addPopup(e.x, e.y-110*e.scale, 'GLASSES OFF! 👓', '#9adcff');
          beep(900,0.05,'square',0.05,-300);
        } else {
          e.hp -= 16; e.hurtT = 0.3; e.vx += Math.sign(e.x-s.x||1)*3; e.pose='hit'; e.poseT=0;
          burst(s.x, s.y, '#bfeaff', 8); beep(260,0.08,'square',0.05,-200);
          if(e.hp <= 0 && !e.dead){ e.dead = true; e.pose='ko'; addScore(25, e.x, e.y-100); burst(e.x, e.y-60, '#ffd43b', 12); dropCoins(e.x, 2); }
        }
        s.hit = true; s.life = Math.min(s.life, 0.05); break;
      }
    }
    if(s.hit) continue;
    // wiedźmy na miotłach — strzał w górę je odpędza
    if(s.up){
      for(const w of witches){
        if(w.spook>0) continue;
        const dx = w.x - s.x, dy = w.y - s.y;
        if(dx*dx + dy*dy < (s.r + 22)*(s.r + 22)){
          w.spook = 2.6; w.throwCd = Math.max(w.throwCd, 3.0);
          addPopup(w.x, w.y-30, 'HIT! 🎯 '+w.name, '#9adcff');
          addScore(40, w.x, w.y-20); burst(w.x, w.y, '#b6f', 12);
          beep(300,0.2,'sawtooth',0.04,-200);
          s.hit = true; s.life = Math.min(s.life, 0.05); break;
        }
      }
    }
    if(s.y > GROUND-4){ burst(s.x, GROUND-6, '#bfeaff', 6); s.hit = true; s.life = Math.min(s.life, 0.05); }
  }
  shots = shots.filter(s => s.life > 0);
}

function updateGas(dt){
  // chmury: rosną, dryfują, blakną, gazują wrogów w zasięgu
  for(const g of gasClouds){
    g.life -= dt;
    g.r += (g.maxR - g.r) * 0.06;
    g.x += g.vx; g.y += g.vy; g.vx *= 0.94; g.vy += -0.015; g.vy *= 0.96;
    if(g.life < 0.9) g.r *= 0.985;       // pod koniec się rozwiewa
    if(Math.random() < 0.5) gasPuffs.push({x:g.x+(Math.random()-0.5)*g.r*1.2, y:g.y+(Math.random()-0.5)*g.r, vx:(Math.random()-0.5)*0.6, vy:-0.3-Math.random()*0.4, r:6+Math.random()*10, life:0.6+Math.random()*0.5});
    for(const e of enemies){
      if(e.dead || e.pooled || e.frozen>0) continue;
      const dx = e.x - g.x, dy = (e.y - 46) - g.y;
      if(dx*dx + dy*dy < (g.r*0.9)*(g.r*0.9)){
        if(e.glasses){
          // okularnik: gaz go nie bierze — ale chmura zbija mu okulary z nosa
          e.glasses = false; e.glassLost = 0.0;
          glassFlies.push({x:e.x, y:e.y-62*e.scale, vx:(e.x>g.x?2:-2)+(Math.random()-0.5), vy:-3-Math.random(), rot:0, vr:0.3, life:1.1});
          addPopup(e.x, e.y-110*e.scale, 'GLASSES OFF! 👓', '#9adcff');
          beep(900,0.05,'square',0.05,-300);
          continue;
        }
        e.gasT = Math.max(e.gasT||0, 2.4);
        e.hp -= 22 * dt;                  // mocno słabnie w chmurze — szybko pada
        if(e.hp <= 0 && !e.dead){ e.dead = true; e.pose='ko'; addScore(25, e.x, e.y-100); }
      }
    }
    // słup gazu dosięga wiedźm na miotłach — odpędza je i daje punkty
    if(g.up){
      for(const w of witches){
        if(w.spook>0) continue;
        const dx = w.x - g.x, dy = w.y - g.y;
        if(dx*dx + dy*dy < (g.r*0.95)*(g.r*0.95)){
          w.spook = 2.6; w.throwCd = Math.max(w.throwCd, 3.0);
          addPopup(w.x, w.y-30, 'GASSED! 💨 '+w.name, '#9adcff');
          addScore(40, w.x, w.y-20); burst(w.x, w.y, '#b6f', 12);
          beep(300,0.2,'sawtooth',0.04,-200);
        }
      }
    }
  }
  gasClouds = gasClouds.filter(g => g.life > 0 && g.r > 3);
  for(const pf of gasPuffs){ pf.x += pf.vx; pf.y += pf.vy; pf.vy -= 0.01; pf.r += dt*14; pf.life -= dt; }
  gasPuffs = gasPuffs.filter(pf => pf.life > 0);
  for(const gf of glassFlies){ gf.x += gf.vx; gf.y += gf.vy; gf.vy += 0.35; gf.rot += gf.vr; gf.life -= dt;
    if(gf.y > GROUND-4){ gf.y = GROUND-4; gf.vy *= -0.4; gf.vx *= 0.6; } }
  glassFlies = glassFlies.filter(gf => gf.life > 0);
}

function hitEnemy(t, dmg, vx, vy, launch){
  if(t.frozen > 0) dmg = Math.round(dmg*1.5);
  t.hp -= dmg; t.hurtT = 0.42; t.spec = null; t.specHit = false;
  t.vx = vx / (t.mass || 1);
  if(vy){ t.vy = vy / Math.sqrt(t.mass || 1); t.onGround = false; }
  t.pose = 'hit'; t.poseT = 0;
  const hy = t.y - 60*t.scale;
  burst(t.x, hy, launch ? '#fff176' : '#ffb300', 11);
  hitFx.push({x:t.x, y:hy, r:10*t.scale, life:0.26, big:true});
  combo++; comboT = 1.6;
  superCharge = Math.min(100, superCharge + 18);
  addScore(launch ? 35 : 25, t.x, hy);
  if(t.hp <= 0){
    t.dead = true; t.pose = 'ko';
    addScore(25, t.x, hy); burst(t.x, hy, '#ffd43b', 14);
    maybeDropWeapon(t.x); dropCoins(t.x, 2);
  }
}

// ---------- update ----------
// stały krok fizyki 60 Hz — identyczne tempo na 60/90/120 Hz (iPhone ProMotion)
const STEP = 1/60;
let last = performance.now(), acc = 0;
function loop(now){
  let frame = (now-last)/1000; last = now;
  if(frame > 0.25) frame = 0.25; // po uśpieniu karty nie przewijaj setek klatek
  if(paused){ draw(); requestAnimationFrame(loop); return; }
  if(hitStop > 0){ hitStop = Math.max(0, hitStop - frame); draw(); requestAnimationFrame(loop); return; }
  if(slowmo > 0) slowmo = Math.max(0, slowmo - frame); // odliczaj w czasie rzeczywistym
  acc += frame * (slowmo > 0 ? 0.35 : 1); // slow-motion przy nokaucie bossa
  let steps = 0;
  while(acc >= STEP && steps < 5){ time += STEP; update(STEP); acc -= STEP; steps++; }
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  if(shake>0) shake = Math.max(0, shake - dt*30);
  msgT = Math.max(0, msgT - dt);
  girl.panicT += dt;

  particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.vy+=0.3; p.life-=dt;});
  particles = particles.filter(p=>p.life>0);
  hearts.forEach(h=>{h.y-=dt*40; h.life-=dt;});
  hearts = hearts.filter(h=>h.life>0);
  splashes.forEach(s=>{s.x+=s.vx; s.y+=s.vy; s.vy+=0.35; s.life-=dt;});
  splashes = splashes.filter(s=>s.life>0);
  popups.forEach(p=>{p.y += p.vy; p.life -= dt*1.3;});
  popups = popups.filter(p=>p.life>0);
  shocks.forEach(s=>{s.r += dt*650; s.life -= dt;});
  shocks = shocks.filter(s=>s.life>0);
  hitFx.forEach(h=>{h.r += dt*(h.big?280:200); h.life -= dt;});
  hitFx = hitFx.filter(h=>h.life>0);
  wfx.forEach(w=>w.life -= dt);
  wfx = wfx.filter(w=>w.life>0);
  camPunch = Math.max(0, camPunch - dt*0.28);
  dmgVig = Math.max(0, dmgVig - dt*1.8);
  bannerT = Math.max(0, bannerT - dt);
  trail.forEach(g=>g.life -= dt);
  trail = trail.filter(g=>g.life>0);
  confetti.forEach(c=>{ c.x+=c.vx; c.y+=c.vy; c.vy+=0.02; c.rot+=c.vr; c.vx+=Math.sin(time*3+c.y*0.05)*0.05; c.life-=dt; });
  confetti = confetti.filter(c=>c.life>0 && c.y < H+20);
  // animowany pasek HP: natychmiast spada zielony, biały „ślad" dogania z opóźnieniem
  const hpTarget = player ? Math.max(0, player.hp/player.maxHp) : 1;
  hpShown = hpTarget;
  if(hpGhost > hpShown) hpGhost = Math.max(hpShown, hpGhost - dt*0.6);
  else hpGhost = hpShown;
  if(comboT > 0){ comboT -= dt; if(comboT <= 0) combo = 0; }
  flashT = Math.max(0, flashT - dt);

  // W scenkach fizyka nie jest wołana, więc liczniki błysku stały w miejscu
  // i postacie migały bez końca. Tutaj odliczają się same.
  if(state !== 'fight'){
    if(player){ player.hurtT = Math.max(0, player.hurtT - dt); player.invuln = Math.max(0, player.invuln - dt); }
    if(enemies) for(const e of enemies){ e.hurtT = Math.max(0, e.hurtT - dt); e.invuln = Math.max(0, e.invuln - dt); }
  }

  // Halloween: nietoperze, wiedźmy i dynie żyją we wszystkich stanach rozgrywki (atmosfera),
  // ale wiedźmy rzucają dyniami tylko w walce (patrz updateWitches).
  for(const b of bats){ b.ph += dt*b.sp*3; b.x -= dt*(10+b.sp*18); if(b.x < camX-120) b.x = camX+W+120+Math.random()*200; }
  updateWitches(dt);
  updatePumpkins(dt);
  updateShots(dt);

  if(state==='fight') updateFight(dt);
  else if(state==='lose') updateLose(dt);
  else if(state==='win') updateWin(dt);
}

// dokąd wolno danej postaci dojść — gracz jest zamknięty w arenie, dopóki jej nie wyczyści
function limitsFor(f){
  const a = AREAS[wave];
  if(areaPhase === 'fight' && a){
    if(f === player) return [Math.max(WORLD_MIN_X, a.x0 - 70), a.x1];
    // wrogowie też siedzą w arenie — inaczej miotacz ucieka tam, gdzie gracz nie wejdzie
    if(f.entering) return [WORLD_MIN_X, WORLD_MAX_X];
    return [Math.max(WORLD_MIN_X, a.x0 - 130), a.x1];
  }
  return [WORLD_MIN_X, WORLD_MAX_X];
}

function physics(f, dt){
  f.x += f.vx + f.moveVx; f.vx *= 0.82;
  if(f.hurtT > 0) f.moveVx *= 0.85;
  if(!f.onGround){ f.vy += 0.55; f.y += f.vy;
    if(f.y>=GROUND){
      const impact = f.vy;
      f.y=GROUND; f.onGround=true; f.vy=0;
      if(impact > 4){ // kurz + przysiad przy lądowaniu
        f.squash = Math.min(0.28, impact * 0.024);
        for(let i=0;i<6;i++) particles.push({x:f.x+(Math.random()-0.5)*18*f.scale, y:GROUND, vx:(Math.random()-0.5)*3, vy:-Math.random()*2, life:0.4, color:'#e0cda8'});
      }
    }
  }
  const lim = limitsFor(f);
  f.x = Math.max(lim[0], Math.min(lim[1], f.x));
  // płynny obrót zamiast natychmiastowego lustra — postać realnie się odwraca
  if(f.faceX === undefined) f.faceX = f.facing;
  f.faceX += (f.facing - f.faceX) * Math.min(1, dt*16);
  f.attackCd = Math.max(0, f.attackCd - dt);
  f.hurtT = Math.max(0, f.hurtT - dt);
  f.invuln = Math.max(0, f.invuln - dt);
  f.squash *= Math.max(0, 1 - dt*9);
  f.poseT += dt;
}

function updateFight(dt){
  // player controls (płynne przyspieszanie i hamowanie)
  const p = player;
  let moving = false, targetVx = 0;
  p.blocking = false;

  // ---- KIOSK: poza walką można wymienić monety na zdrowie, naprawę broni albo nową broń ----
  kioskMsgT = Math.max(0, kioskMsgT - dt);
  kioskCd = Math.max(0, kioskCd - dt);
  kioskNear = null;
  if(areaPhase !== 'fight'){
    for(const k of KIOSKS) if(Math.abs(p.x - k.x) < 80){ kioskNear = k; break; }
  }
  if(kioskNear && kioskCd <= 0){
    if(keys['1'] || keys['j']){ keys['1'] = keys['j'] = false; buyAt(1); }
    else if(keys['2'] || keys['k']){ keys['2'] = keys['k'] = false; buyAt(2); }
    else if(keys['3'] || keys['l']){ keys['3'] = keys['l'] = false; buyAt(3); }
  }
  p.chainT = Math.max(0, p.chainT - dt);
  if(p.chainT <= 0) p.chain = 0;
  const ATK_POSES = ['punch','kick','upper','spin','sweep','fly','spray'];
  if(keys['s'] && p.onGround && p.hurtT<=0 && !ATK_POSES.includes(p.pose)){
    p.blocking = true; p.pose = 'block';   // sama obrona — Greg nie bije, tylko gazuje
  } else if(p.hurtT<=0 && !ATK_POSES.includes(p.pose) || p.poseT>0.25){
    if(p.pose==='block') p.pose='idle';
    if(keys['arrowleft']||keys['a']){ targetVx = -p.speed; p.facing=-1; moving=true; }
    if(keys['arrowright']||keys['d']){ targetVx = p.speed; p.facing=1; moving=true; }
    if((keys['arrowup']||keys['w']||keys[' ']) && p.onGround){ p.vy=-10.6; p.onGround=false; p.squash=-0.18; }
    // GREG MA TYLKO GAZ ŁZAWIĄCY. W bok: J / K / F. W GÓRĘ (na wiedźmy): U / I lub skok+gaz.
    if(gasCd<=0 && p.attackCd<=0){
      if(keys['u'] || keys['i']) sprayGas(p, true);         // dedykowany „gaz w górę" (też na telefon)
      else if(keys['j'] || keys['k'] || keys['f']) sprayGas(p); // gaz przed siebie (lub w górę, gdy w skoku)
    }
  }
  gasCd = Math.max(0, gasCd - dt);
  if(p.pose==='spray' && p.poseT>0.3) p.pose='idle';
  // płynne przyspieszanie/hamowanie zamiast skokowej prędkości
  const accel = targetVx !== 0 ? 0.22 : 0.30;
  p.moveVx += (targetVx - p.moveVx) * accel;
  if(Math.abs(p.moveVx) < 0.04) p.moveVx = 0;
  // cheerleaderka łapie oddech — powolna regeneracja, gdy żaden baran nie napiera
  if(p.hurtT<=0 && p.hp>0 && p.hp<p.maxHp){
    const foe = enemies.some(e=>!e.dead && !e.pooled && Math.abs(e.x-p.x)<150);
    if(!foe) p.hp = Math.min(p.maxHp, p.hp + 7*dt);
  }
  // kurz spod nóg przy biegu
  if(p.onGround && Math.abs(p.moveVx) > 1.6){
    dustT += dt;
    if(dustT > 0.07){ dustT = 0;
      particles.push({x:p.x - Math.sign(p.moveVx)*10*p.scale, y:GROUND, vx:-Math.sign(p.moveVx)*(1+Math.random()*1.5), vy:-Math.random()*1.4, life:0.4, color:'rgba(220,205,175,0.9)'});
    }
  }
  if(p.pose==='punch'&&p.poseT>0.24) p.pose='idle';
  if(p.pose==='kick'&&p.poseT>0.31) p.pose='idle';
  if(p.pose==='shoot'&&p.poseT>0.22) p.pose='idle';
  if(p.pose==='hit'&&p.poseT>0.3) p.pose='idle';
  if(p.pose==='upper'&&p.poseT>0.40) p.pose='idle';
  if(p.pose==='spin' &&p.poseT>0.44) p.pose='idle';
  if(p.pose==='sweep'&&p.poseT>0.42) p.pose='idle';
  if(p.pose==='fly'  &&(p.onGround || p.poseT>0.7)) p.pose='idle';
  // tempo kroku zgrane z realną prędkością — stopy nie ślizgają się po deskach
  const gait = 5.2 + Math.abs(p.moveVx)*3.0;
  if(moving && (p.pose==='idle'||p.pose==='walk')){ p.pose='walk'; p.walkT += dt*gait; }
  else if(!moving && p.pose==='walk'){ if(Math.abs(p.moveVx) < 0.5) p.pose='idle'; else p.walkT += dt*gait; }
  physics(p, dt);
  // smugi ruchu (afterimages) — przy super, aktywnym kopnięciu lub szybkim biegu
  const trailing = flashT>0.05 || (p.pose==='kick' && p.poseT<0.22) || Math.abs(p.moveVx)>2.7;
  if(trailing){ trail.push(Object.assign({}, p, {isGreg:true, ghost:true, name:'', life:0.2})); if(trail.length>10) trail.shift(); }

  // reżyser walki — kto teraz naciera, kto obchodzi, kto czeka (co pół sekundy)
  roleT -= dt;
  if(roleT <= 0){ roleT = 0.45; assignRoles(); }

  // enemies AI
  for(const e of enemies){
    if(e.pooled && !e.pooledSunk){
      // zbir leci w powietrzu po kopniaku
      e.x += e.vx; e.y += e.vy; e.vy += 0.5; e.rot += 0.28;
      e.x = Math.min(e.x, POOL.x + POOL.w - 40);
      if(e.y >= POOL.top + 30){
        if(e.x > POOL.x){
          e.pooledSunk = true; e.y = POOL.top + 32;
          sndSplash(); shake = Math.max(shake, 6);
          for(let i=0;i<18;i++) splashes.push({x:e.x, y:POOL.top, vx:(Math.random()-0.5)*6, vy:-Math.random()*7-2, life:0.8});
        } else { e.pooled = false; e.y = GROUND; e.rot = 0; e.pose = 'ko'; }
      }
      continue;
    }
    if(e.dead){ continue; }
    // wszedł już na arenę — od tej chwili obowiązują go jej granice
    if(e.entering){
      const ar0 = AREAS[wave];
      if(!ar0 || (e.x > ar0.x0 - 40 && e.x < ar0.x1 - 10)) e.entering = false;
    }
    // powalony podcięciem — leży, po chwili wstaje
    if(e.knockT > 0){
      e.knockT -= dt; e.pose = 'ko'; e.vx *= 0.86;
      physics(e, dt);
      if(e.knockT <= 0){ e.pose='idle'; e.poseT=0; e.attackCd = 0.45; e.spec = null; }
      continue;
    }
    // zamrożony lodem z wiaderka — stoi jak sopel, ale można go okładać
    if(e.frozen > 0){
      e.frozen -= dt;
      if(e.pose !== 'hit' || e.poseT > 0.35) e.pose = 'idle';
      e.vx *= 0.7;
      if(Math.random() < 0.22)
        particles.push({x:e.x + (Math.random()-0.5)*24, y:e.y - Math.random()*76, vx:0, vy:0.6, life:0.45, color:'#dff4ff'});
      physics(e, dt);
      continue;
    }
    // ZAGAZOWANY — kaszle, zasłania oczy, zatacza się od Grega, nie atakuje
    if(e.gasT > 0){
      e.gasT -= dt;
      e.charging = 0;                           // gaz przerywa szarżę
      e.hp -= 7 * dt;                           // dławi się dalej — i tak padnie (koniec zawieszania walki)
      if(e.hp <= 0 && !e.dead){ e.dead = true; e.pose='ko'; addScore(25, e.x, e.y-100); physics(e, dt); continue; }
      e.facing = Math.sign(e.x - p.x || 1);     // odwraca się od gazu
      e.vx += (Math.sign(e.x - p.x || 1) * 1.6 - e.vx*0.12); // ucieka tyłem od chmury
      e.walkT += dt*18; e.pose = 'cough';
      if(Math.random() < 0.3)
        particles.push({x:e.x + (Math.random()-0.5)*18, y:e.y - 50 - Math.random()*30, vx:(Math.random()-0.5)*1, vy:-0.4, life:0.5, color:'rgba(190,210,120,0.8)'});
      physics(e, dt);
      continue;
    }
    // BARAN SZARŻUJE — pochyla łeb i pędzi, żeby przewrócić Grega
    e.chargeCd = Math.max(0, (e.chargeCd||0) - dt);
    if(e.charging > 0){
      e.charging -= dt; e.pose = 'charge';
      e.vx = e.chargeDir * 8.2; e.moveVx = 0; e.walkT += dt*22;
      if(Math.random()<0.5) particles.push({x:e.x - e.chargeDir*12, y:GROUND, vx:-e.chargeDir*2, vy:-Math.random()*2, life:0.35, color:'#e0cda8'});
      if(Math.abs(e.x - p.x) < 30*e.scale && p.invuln<=0 && !p.dead && !p.blocking){
        p.hp -= e.dmgPunch; p.hurtT=0.6; p.invuln=1.0; combo=0; dmgVig=0.75;
        p.vx = e.chargeDir*13; p.vy=-5.5; p.onGround=false; p.moveVx=0; p.pose='hit'; p.poseT=0; p.squash=0.2;
        shake=Math.max(shake,10); hitStop=Math.max(hitStop,0.06);
        beep(85,0.16,'sine',0.11,-40); beep(300,0.1,'sawtooth',0.06,-150);
        addPopup(p.x, p.y-150, 'A RAM FLOORED YOU! 🐏', '#ff8a8a');
        e.charging=0; e.vx=-e.chargeDir*4; e.attackCd=0.9;
      }
      physics(e, dt);
      if(e.charging<=0){ e.pose='idle'; e.poseT=0; e.attackCd=Math.max(e.attackCd,0.7); }
      continue;
    }
    // wejście z góry — zeskok zza baru, z wieży albo z dachu kabiny
    if(!e.isArek && e.pose === 'slam'){
      physics(e, dt);
      if(e.onGround){
        e.pose = 'idle'; e.poseT = 0;
        shake = Math.max(shake, 5); beep(95, 0.13, 'sine', 0.08, -45);
        for(let k=0;k<12;k++)
          particles.push({x:e.x + (Math.random()-0.5)*28, y:GROUND, vx:(Math.random()-0.5)*5, vy:-Math.random()*3.2, life:0.5, color:'#e0cda8'});
      }
      continue;
    }
    const dx = p.x - e.x;
    // AREK: skok + uderzenie w ziemię (fala wstrząsowa)
    if(e.isArek){
      e.specialCd -= dt;
      if(e.pose === 'slam'){
        if(!e.onGround) e.slamAir = true;
        else if(e.slamAir){
          e.slamAir = false; e.pose = 'idle'; e.specialCd = 5 + Math.random()*2;
          shockwave(e);
        }
        physics(e, dt); continue;
      }
      if(e.specialCd <= 0 && Math.abs(dx) < 300 && e.onGround && e.hurtT <= 0){
        e.pose = 'slam'; e.poseT = 0;
        e.vy = -9; e.onGround = false;
        e.vx = Math.sign(dx || 1) * 3;
        physics(e, dt); continue;
      }
    }
    e.facing = Math.sign(dx||1);
    // MIOTACZ: trzyma dystans i rzuca piłkami plażowymi
    if(e.ranged){
      const d = Math.abs(dx);
      e.strafeT -= dt;
      if(e.strafeT <= 0){ e.strafeT = 0.6 + Math.random()*0.8; e.strafeDir = Math.random()<0.5 ? -1 : 1; }
      if(e.hurtT<=0){
        let vx;
        if(fightT > 40) vx = e.facing*e.speed;         // przeciągnięta walka — koniec uciekania
        else if(d < 170) vx = -e.facing*e.speed;       // za blisko — wycofuje się
        else if(d > 300) vx = e.facing*e.speed;        // za daleko — dochodzi
        else vx = e.strafeDir*e.speed*0.5;             // w zasięgu — krąży, nie stoi
        e.vx = vx;
        e.walkT += dt*(4.2 + Math.abs(vx)*3.1);
        if(e.pose==='idle') e.pose='walk';
        if(d >= 150 && d <= 330 && e.attackCd<=0){
          e.attackCd = e.cdBase*0.7 + Math.random()*0.6;
          e.pose='punch'; e.poseT=0;
          balls.push({x:e.x + e.facing*16, y:e.y - 62*e.scale, vx:e.facing*(4.2+Math.random()), vy:-3.2, rot:0, from:'enemy', bounces:0});
          beep(500, 0.07, 'sine', 0.06);
        }
      }
      if(e.pose==='punch'&&e.poseT>0.25) e.pose='idle';
      if(e.pose==='hit'&&e.poseT>0.35) e.pose='idle';
      physics(e, dt);
      continue;
    }
    // ---- TECHNIKI SPECJALNE PRZECIWNIKÓW: doskok, szarża, kopniak z wyskoku, podcięcie ----
    const sp = SPECIALS[e.etype];
    if(sp && !e.isArek){
      const dS = Math.abs(dx), reachS = 44*e.scale + e.stopOff*0.8;
      e.specialCd -= dt;
      if(e.spec){
        if(e.hurtT > 0 && e.etype !== 'ochroniarz'){ e.spec = null; e.specHit = false; } // ochroniarz prze dalej
        else {
          e.specT += dt;
          if(e.tellT > 0){                       // zapowiedź — widać, że coś szykuje
            e.tellT -= dt; e.pose = 'ready'; e.vx *= 0.7;
            if(e.tellT <= 0){
              e.pose = sp.pose; e.poseT = 0;
              e.vx = e.facing*sp.vx;
              if(sp.vy){ e.vy = sp.vy; e.onGround = false; }
              beep(sp.kind==='sweep' ? 110 : 230, 0.13, 'sawtooth', 0.07, -60);
            }
            physics(e, dt); continue;
          }
          if(sp.kind !== 'jump' || !e.onGround) e.vx = e.facing*sp.vx;
          e.walkT += dt*9;
          if(!e.specHit && Math.abs(p.x - e.x) < 64*e.scale && Math.abs(p.y - e.y) < 100){
            e.specHit = true;
            tryAttack(e, [p], sp.kind === 'sweep' ? 'kick' : 'punch');
            if(p.hp<=0) break;
          }
          if(e.specT > sp.dur || (sp.kind === 'jump' && e.onGround && e.specT > 0.25)){
            e.spec = null; e.specHit = false; e.pose = 'idle'; e.poseT = 0; e.attackCd = 0.4;
          }
          physics(e, dt); continue;
        }
      }
      if(e.specialCd <= 0 && dS > reachS + 40 && dS < 340 && e.onGround && e.hurtT <= 0){
        e.spec = sp; e.specT = 0; e.specHit = false; e.tellT = sp.tell;
        e.specialCd = sp.cd[0] + Math.random()*sp.cd[1];
        e.pose = 'ready'; e.poseT = 0;
        addPopup(e.x, e.y - 120*e.scale, sp.name + '!', sp.col);
        beep(920, 0.07, 'square', 0.05);
        physics(e, dt); continue;
      }
    }

    // ---- zwarcie: reżyser rozdaje role, dzięki czemu nikt nie stoi jak słup ----
    const d = Math.abs(dx);
    const reach = 44*e.scale + e.stopOff*0.8;
    const side = e.side || Math.sign(e.x - p.x) || 1;
    e.strafeT -= dt;
    if(e.strafeT <= 0){ e.strafeT = 0.45 + Math.random()*0.8; e.strafeDir = Math.random()<0.5 ? -1 : 1; }
    if(e.hurtT<=0){
      // BARAN rozpoczyna szarżę z średniego dystansu
      if(e.rammer && e.chargeCd<=0 && e.onGround && d > reach+30 && d < reach+230 && Math.abs(e.y-p.y)<40){
        e.charging = 0.9; e.chargeDir = Math.sign(p.x - e.x)||1; e.facing = e.chargeDir;
        e.chargeCd = 4 + Math.random()*2.5; e.pose='charge'; e.poseT=0;
        addPopup(e.x, e.y-120*e.scale, 'CHARGE! 🐏', '#ffd43b');
        beep(180,0.14,'sawtooth',0.07,70);
        physics(e, dt); continue;
      }
      const attacker = e.isArek || e.role === 'attacker' || fightT > 40;
      if(attacker && d <= reach + 8 && e.attackCd<=0){
        const kick = Math.random()<0.38;
        e.pose = kick?'kick':'punch'; e.poseT=0;
        e.attackCd = e.isArek ? 1.15 + Math.random()*0.5 : e.cdBase*0.55 + Math.random()*0.5;
        e.vx = e.facing * (kick?3.4:2.4);
        tryAttack(e, [p], kick?'kick':'punch');
        if(p.hp<=0) break;
      } else {
        // dystans, na jakim chce stać dana rola — i ciągły ruch zamiast bezczynności
        const want = attacker ? reach
                   : e.role === 'flanker' ? reach + 74 + e.stopOff*3
                   : reach + 168 + e.stopOff*4;
        const tx = p.x + side*want;
        const err = tx - e.x;
        let vx;
        if(Math.abs(err) > 14){
          vx = Math.sign(err) * e.speed * (Math.sign(err) === e.facing ? 1 : 0.8);
          if(e.etype === 'szybki' && Math.abs(err) > 90) vx *= 1.55;      // szybcy robią doskoki
          if(e.etype === 'ochroniarz' && Math.abs(err) > 50) vx *= 1.18;  // ochroniarz szarżuje barkiem
        } else {
          vx = e.strafeDir * e.speed * 0.45;                              // przestępowanie z nogi na nogę
        }
        e.vx = vx;
        e.walkT += dt*(4.2 + Math.abs(vx)*3.1);
        if(e.pose==='idle'||e.pose==='walk') e.pose='walk';
      }
    }
    if(e.pose==='punch'&&e.poseT>0.25) e.pose='idle';
    if(e.pose==='kick'&&e.poseT>0.35) e.pose='idle';
    if(e.pose==='hit'&&e.poseT>0.35) e.pose='idle';
    physics(e, dt);
  }

  if(p.hp<=0){
    p.hp = 0; p.dead = true; p.pose='ko';
    startLose();
    return;
  }

  // rozpychanie wrogów — koniec ze zlewaniem się w jedną kupę
  for(let i=0;i<enemies.length;i++){
    const a = enemies[i];
    if(a.dead || a.pooled) continue;
    for(let j=i+1;j<enemies.length;j++){
      const b = enemies[j];
      if(b.dead || b.pooled) continue;
      const minD = 26*(a.scale+b.scale)/2 + 8;
      const d = a.x - b.x;
      if(Math.abs(d) < minD){
        const push = (minD - Math.abs(d)) * 0.5 * (d !== 0 ? Math.sign(d) : (i%2 ? 1 : -1));
        a.x += push; b.x -= push;
        a.x = Math.max(30, Math.min(POOL.x - 15, a.x));
        b.x = Math.max(30, Math.min(POOL.x - 15, b.x));
      }
    }
  }

  // znokautowani znikają po chwili (pole walki bez bałaganu)
  for(const e of enemies){ if(e.dead && !e.pooled && !e.pooledSunk) e.koT += dt; }
  enemies = enemies.filter(e => !(e.dead && !e.pooled && !e.pooledSunk && e.koT > 2.4));

  // piłki plażowe (pociski miotaczy)
  for(const b of balls){
    if(b.boom){
      // klapek-bumerang: wylatuje, wyhamowuje, zawraca i sam wraca do ręki
      b.bt += dt;
      b.vx = b.dir * Math.max(-12, 9.5 * (1 - b.bt/0.5));
      b.vy = ((p.y - 62) - b.y) * 0.09;          // celuje z powrotem w wysokość ręki
      b.x += b.vx; b.y += b.vy; b.rot += 0.45;
      if(b.bt > 0.55 && Math.abs(b.x - p.x) < 42 && !p.dead){
        b.deadBall = true;
        if(p.weapon === 'flipflop'){
          p.wUses++;
          addPopup(p.x, p.y - 138, '🩴 CAUGHT! +1', '#8bc34a');
          beep(1400, 0.07, 'square', 0.07); beep(1900, 0.06, 'square', 0.05);
        }
        continue;
      }
    } else {
      b.x += b.vx; b.y += b.vy; b.vy += 0.22; b.rot += 0.2;
      if(b.y >= GROUND - 9){ b.y = GROUND - 9; b.vy = -Math.abs(b.vy)*0.55; b.bounces++; }
    }
    if(b.from==='enemy' && Math.abs(b.x - p.x) < 26 && b.y > p.y - 90 && !p.dead){
      if(p.blocking){
        b.from = 'player'; b.vx = -b.vx * 1.15; b.vy = -3.5; b.bounces = 0;
        addPopup(p.x, p.y - 112, 'DEFLECTED! 🏐', '#9adcff');
        beep(1500, 0.08, 'square', 0.08);
      } else if(p.invuln <= 0){
        p.hp -= 5; p.hurtT = 0.4; p.invuln = 0.6; combo = 0; dmgVig = 0.55;
        p.pose = 'hit'; p.poseT = 0; p.vx = Math.sign(b.vx) * 4;
        sndHurt(); b.deadBall = true;
      }
    }
    if(b.from==='player'){
      for(const e of enemies){
        if(e.dead || e.pooled) continue;
        if(b.hits && b.hits.indexOf(e) >= 0) continue;   // bumerang nie tłucze w kółko tego samego
        if(Math.abs(b.x - e.x) < 30 && b.y > e.y - 95*e.scale){
          e.hp -= 15; e.hurtT = 0.35; e.pose='hit'; e.poseT=0;
          e.vx = Math.sign(b.vx) * 3 / (e.mass||1);
          addScore(20, e.x, e.y - 95*e.scale);
          addPopup(e.x, e.y - 118*e.scale, 'RICOCHET!', '#ffd43b');
          burst(b.x, b.y, '#ffb300', 8);
          if(b.boom) b.hits.push(e); else b.deadBall = true;   // klapek leci dalej i wraca
          if(e.hp <= 0){ e.dead = true; e.pose='ko'; addScore(25, e.x, e.y - 105*e.scale); maybeDropWeapon(e.x); dropCoins(e.x, 2); }
          break;
        }
      }
    }
    // granice liczone względem gracza — niezależne od stanu kamery
    if(Math.abs(b.x - p.x) > 900) b.deadBall = true;
    if(b.boom ? b.bt > 2.4 : b.bounces >= 3) b.deadBall = true;
  }
  balls = balls.filter(b=>!b.deadBall);

  // pociski wody z blastera Grega
  for(const s of waterShots){
    s.x += s.vx; s.y += s.vy; s.vy += 0.12; s.life -= dt;
    // ślad kropelek
    if(Math.random()<0.6) particles.push({x:s.x,y:s.y,vx:-s.vx*0.05,vy:0.4,life:0.3,color:'rgba(140,215,255,0.8)'});
    for(const e of enemies){
      if(e.dead || e.pooled) continue;
      if(Math.abs(s.x - e.x) < 26*e.scale && s.y > e.y - 92*e.scale && s.y < e.y - 8){
        e.hp -= 7; e.hurtT = 0.28; e.pose='hit'; e.poseT=0;
        e.vx = Math.sign(s.vx||1) * 4.5 / (e.mass||1); // silne odepchnięcie
        addScore(8, e.x, e.y - 95*e.scale);
        for(let i=0;i<7;i++) splashes.push({x:s.x,y:s.y,vx:(Math.random()-0.5)*4,vy:-Math.random()*3,life:0.5});
        beep(600,0.05,'sine',0.04,-200);
        // przy krawędzi — wodny strzał spycha do basenu!
        if(!e.isArek && e.x > POOL.x - 70 && s.vx > 0){
          e.pooled = true; e.dead = true; e.hp = 0; e.onGround=false; e.vx=4.5; e.vy=-4;
          addScore(50, e.x, e.y - 120*e.scale); addPopup(e.x, e.y - 140*e.scale, 'SPLASH! 🌊', '#7fd4ff');
        } else if(e.hp <= 0){ e.dead = true; e.pose='ko'; addScore(20, e.x, e.y-105*e.scale); }
        s.life = 0; break;
      }
    }
    if(Math.abs(s.x - p.x) > 720) s.life = 0;
  }
  waterShots = waterShots.filter(s=>s.life>0);
  updateGas(dt);

  // znajdźki na decku: hot-dogi leczące + broń do podniesienia
  for(const it of items){
    it.t += dt;
    const loose = it.kind === 'coin' || it.kind === 'medal';
    // monety wybite z przeciwnika lecą łukiem i lądują na deskach
    if(it.flying){
      it.x += it.vx; it.y += it.vy; it.vy += 0.42; it.vx *= 0.985;
      if(it.y >= GROUND - 12){
        it.y = GROUND - 12; it.vy = -Math.abs(it.vy)*0.42; it.vx *= 0.55;
        if(Math.abs(it.vy) < 1.2){ it.flying = false; it.vy = 0; it.vx = 0; }
      }
    }
    // magnes — monety same wpadają do kieszeni, zbieranie jest satysfakcjonujące
    const dm = p.x - it.x;
    if(!it.taken && loose && Math.abs(dm) < 135){
      it.x += Math.sign(dm) * Math.min(9, Math.abs(dm)*0.2);
      if(it.y === undefined) it.y = GROUND - 12;
      it.y += ((p.y - 62) - it.y) * 0.14;
      it.flying = false;
    }
    if(!it.taken && Math.abs(p.x - it.x) < (loose ? 30 : 34) && (p.onGround || loose)){
      it.taken = true;
      if(it.kind === 'weapon'){
        const w = WEAPONS[it.w];
        p.weapon = it.w; p.wUses = w.uses;
        addPopup(it.x, GROUND - 66, w.icon + ' ' + w.name + '!', w.col);
        addPopup(it.x, GROUND - 96, w.tip, '#e8ecff');
        burst(it.x, GROUND - 40, w.col, 16);
        beep(700,0.07,'square',0.09); beep(1050,0.09,'square',0.09); beep(1400,0.12,'square',0.08);
      } else if(it.kind === 'coin'){
        coins++; addScore(60);
        addPopup(p.x, p.y - 96, '💰 +1', '#ffd43b');
        burst(p.x, p.y - 60, '#ffd43b', 6);
        beep(1250, 0.05, 'square', 0.06); beep(1700, 0.07, 'square', 0.05);
      } else if(it.kind === 'medal'){
        coins += 5; addScore(400);
        addPopup(it.x, GROUND - 84, '🏅 AREA MEDAL  +400', '#ffd43b');
        burst(it.x, GROUND - 46, '#ffd43b', 20); spawnConfetti(18);
        [1046,1318,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.15,'square',0.07), i*95));
      } else {
        p.hp = Math.min(p.maxHp, p.hp + 45);
        addPopup(it.x, GROUND - 60, '+45 HP 🌭', '#8bc34a');
        beep(660, 0.1, 'square', 0.09); beep(880, 0.12, 'square', 0.09);
      }
    }
  }
  items = items.filter(it=>!it.taken);

  // ---- rytm planszy: idź → wejdź na arenę → wyczyść → zgarnij nagrodę → idź dalej ----
  const area = AREAS[wave];
  if(!area) return;
  if(areaPhase === 'travel'){
    if(p.x >= area.x0){
      areaPhase = 'fight'; fightT = 0;
      spawnArea();
      showBanner(area.name, area.intro, '#ffd43b');
      beep(150, 0.22, 'sawtooth', 0.09, 90); beep(300, 0.18, 'square', 0.05, -60);
    }
  } else if(areaPhase === 'fight'){
    fightT += dt;
    // posiłki: na placu naraz walczy najwyżej trójka, kolejni dobiegają w trakcie
    if(spawnQueue.length){
      spawnT += dt;
      const aliveN = enemies.filter(e => !e.dead && !e.pooled).length;
      if(aliveN < 2 && spawnT > 1.9){ spawnT = 0; spawnNextMob(); }  // owce wchodzą pojedynczo — da się ogarnąć gazem
    }
    if(!spawnQueue.length && (enemies.length === 0 || enemies.every(e => e.dead))){
      areaPhase = 'clear';
      addScore(150, p.x, p.y - 140);
      // pani Gosia liczy przewinienia przez megafon — dlatego finał nie spada z nieba
      showBanner('AREA CLEAR — ' + area.name, area.clear, '#8bc34a', area.warn);
      if(area.warn) setTimeout(()=>sndWhistle(), 500);
      dropAreaReward(area);
      sndWin();
      if(area.boss) startWin();
    }
  } else if(areaPhase === 'clear'){
    goArrowT += dt;
    if(p.x > area.x1 + 30){
      wave++;
      goArrowT = 0;
      areaPhase = wave >= AREAS.length ? 'done' : 'travel';
    }
  }
}

function showBanner(title, text, col, note){ banner = {title, text, col, note}; bannerT = 4.6; }

// nagroda za wyczyszczenie terenu — medal, jedzenie, świeża broń i garść monet
function dropAreaReward(area){
  const cx = Math.min(WORLD_MAX_X - 90, area.x1 - 40);
  items.push({kind:'medal',  x: cx,       t:0, taken:false});
  items.push({kind:'hotdog', x: cx - 96,  t:0, taken:false});
  items.push({kind:'hotdog', x: cx + 92,  t:0, taken:false});   // drugi hot-dog zamiast broni (Greg walczy tylko gazem)
  for(let i=0;i<3;i++) items.push({kind:'coin', x: cx + 140 + i*38, t:0, taken:false});
  spawnConfetti(26);
}

// scenka zaczyna się od czystego stanu — żadnych zawieszonych błysków trafienia
function clearFlashes(){
  const all = [player].concat(enemies || []);
  for(const f of all){ if(!f) continue; f.hurtT = 0; f.invuln = 0; f.frozen = 0; f.knockT = 0; f.spec = null; }
  dmgVig = 0; trail = []; wfx = [];
}

function startLose(){
  state='lose';
  balls = [];
  sndLose();
  clearFlashes();
  // przegrana nad basenem = pełna scena z wrzuceniem do wody; wcześniej — Arek ciska Gregiem o deski
  const atPool = player.x > POOL.x - 560;
  if(!arek || arek.dead || Math.abs(arek.x - player.x) > 460){
    arek = mkFighter(Math.min(WORLD_MAX_X, player.x + 160), {color:'#0a0a0a', beltColor:'#c00', scale:1.75, speed:1.4, isArek:true, name:'MR AREK'});
    enemies.push(arek);
  }
  cut = {phase:'walk', t:0, atPool};
}

function updateLose(dt){
  cut.t += dt;
  const a = arek, p = player;
  if(cut.phase==='walk'){
    const dx = p.x - a.x;
    a.facing = Math.sign(dx||1);
    if(Math.abs(dx) > 30){ a.x += a.facing * 1.8; a.walkT += dt*7.5; a.pose='walk'; }
    else { cut.phase='lift'; cut.t=0; a.pose='idle'; }
  } else if(cut.phase==='lift'){
    p.carried = true;
    const k = Math.min(1, cut.t/0.8);
    p.x = a.x; p.y = GROUND - k * 95 * a.scale * 0.8;
    p.rot = k * Math.PI/2;
    if(k>=1){ cut.phase = cut.atPool ? 'carry' : 'slam'; cut.t=0; }
  } else if(cut.phase==='slam'){
    // daleko od basenu — Arek po prostu ciska Gregiem o deski
    const k = Math.min(1, cut.t/0.32);
    p.x = a.x + a.facing*14*k;
    p.y = GROUND - (1-k)*95*a.scale*0.8;
    p.rot = Math.PI/2;
    a.pose = k < 1 ? 'slam' : 'idle';
    if(cut.t > 0.32 && !cut.slammed){
      cut.slammed = true; p.carried = false;
      shake = Math.max(shake, 13); sndKick(); hitStop = Math.max(hitStop, 0.09);
      for(let i=0;i<18;i++)
        particles.push({x:p.x + (Math.random()-0.5)*30, y:GROUND, vx:(Math.random()-0.5)*7, vy:-Math.random()*4.5, life:0.6, color:'#e0cda8'});
    }
    if(cut.t > 1.0){ cut.phase='gloat'; cut.t=0; a.pose='idle'; }
  } else if(cut.phase==='gloat'){
    p.rot = Math.PI/2; p.y = GROUND; p.pose='ko'; p.carried = false;
    a.facing = Math.sign(p.x - a.x || 1);
    if(cut.t > 0.55 && !cut.crew){
      cut.crew = [
        mkFighter(a.x + 96,  {color:'#111',    beltColor:'#333', facing:-1, etype:'zbir'}),
        mkFighter(a.x + 156, {color:'#26323e', beltColor:'#09f', scale:0.88, facing:-1, etype:'szybki'})
      ];
      enemies.push(...cut.crew);
      beep(180, 0.3, 'sawtooth', 0.08, -60);
    }
  } else if(cut.phase==='carry'){
    a.facing = 1; a.x += 1.8; a.walkT += dt*7.5; a.pose='walk';
    p.x = a.x; p.y = GROUND - 95*a.scale*0.8;
    if(a.x >= POOL.x - 30){ cut.phase='throw'; cut.t=0; a.pose='punch'; a.poseT=0;
      p.vx = 3.2; p.vy = -5; }
  } else if(cut.phase==='throw'){
    p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.rot += 0.25;
    p.x = Math.min(p.x, POOL.x + POOL.w - 70);
    if(p.y >= POOL.top + 30 && p.x > POOL.x){
      cut.phase='sunk'; cut.t=0;
      sndSplash(); shake = 8;
      for(let i=0;i<26;i++) splashes.push({x:p.x, y:POOL.top, vx:(Math.random()-0.5)*7, vy:-Math.random()*8-2, life:0.9});
      p.y = POOL.top + 34;
    }
  } else if(cut.phase==='sunk'){
    // głowa Grega dryfuje w basenie; po chwili zbiry biorą się za Natalkę
    p.y = POOL.top + 34 + Math.sin(time*2)*3;
    if(cut.t > 1.1){
      cut.helpers = [
        mkFighter(girl.x - 130, {color:'#111', beltColor:'#333', facing:1}),
        mkFighter(girl.x - 190, {color:'#111', beltColor:'#333', facing:1})
      ];
      enemies.push(...cut.helpers);
      cut.phase='girlGrab'; cut.t=0;
    }
  } else if(cut.phase==='girlGrab'){
    p.y = POOL.top + 34 + Math.sin(time*2)*3;
    const targets = [girl.x - 36, girl.x - 12];
    let done = true;
    cut.helpers.forEach((h,i)=>{
      const tx = targets[i];
      if(Math.abs(h.x - tx) > 4){ h.x += Math.sign(tx - h.x)*2.2; h.walkT += dt*8; h.pose='walk'; done = false; }
      else h.pose='idle';
    });
    if(done){ cut.phase='girlLift'; cut.t=0; }
  } else if(cut.phase==='girlLift'){
    p.y = POOL.top + 34 + Math.sin(time*2)*3;
    const k = Math.min(1, cut.t/0.7);
    girl.yOff = -55*k; girl.rot = 0.45*k;
    cut.helpers.forEach(h=>{ h.pose='punch'; h.poseT=0.05; }); // ręce w górze — trzymają ją
    if(cut.t > 1.05){ cut.phase='girlThrow'; cut.t=0; girl.vx=2.4; girl.vy=-5.2; }
  } else if(cut.phase==='girlThrow'){
    p.y = POOL.top + 34 + Math.sin(time*2)*3;
    girl.x += girl.vx; girl.yOff += girl.vy; girl.vy += 0.4; girl.rot += 0.22;
    girl.x = Math.min(girl.x, POOL.x + POOL.w - 130);
    if(GROUND + girl.yOff >= POOL.top + 28 && girl.x > POOL.x){
      cut.phase='girlSunk'; cut.t=0; girl.sunk = true;
      sndSplash(); shake = 7;
      for(let i=0;i<22;i++) splashes.push({x:girl.x, y:POOL.top, vx:(Math.random()-0.5)*7, vy:-Math.random()*8-2, life:0.9});
    }
  } else if(cut.phase==='girlSunk'){
    p.y = POOL.top + 34 + Math.sin(time*2)*3;
  }
}

function startWin(){
  state='win';
  balls = [];
  sndWin();
  clearFlashes();
  girl.saved = false;
  gosia = mkGosia(player.x - 500); // wchodzi zza lewej krawędzi kadru, nie z końca świata
  cut = {phase:'run', t:0};
}

const sndWhistle = ()=>{ beep(2300,0.16,'square',0.07,320); setTimeout(()=>beep(2500,0.22,'square',0.07,-260),170); };
function sndZap(){
  beep(70, 0.35, 'sawtooth', 0.13, 40);
  beep(2600, 0.28, 'square', 0.06, -1800);
  beep(1400, 0.3, 'sawtooth', 0.05, 900);
}

function updateWin(dt){
  cut.t += dt;
  const p = player;
  // fajerwerki!
  if(Math.random() < 0.06){
    const cols = ['#ff5252','#ffd43b','#7fd4ff','#ff5fa2','#8bc34a'];
    burst(p.x - 420 + Math.random()*840, 70 + Math.random()*180, cols[Math.random()*cols.length|0], 26);
    beep(900 + Math.random()*600, 0.14, 'sine', 0.035);
  }
  if(cut.phase==='run'){
    p.pose='idle';
    if(girl.x > p.x + 46){ girl.x -= 2.6; girl.runT += dt*12; }
    else {
      girl.saved = true;
      addPopup((p.x+girl.x)/2, GROUND - 145, '💋 SMOOCH!', '#ff5fa2');
      beep(1046, 0.2, 'sine', 0.1); beep(1318, 0.25, 'sine', 0.1);
      for(let i=0;i<6;i++) hearts.push({x:(p.x+girl.x)/2 + (Math.random()-0.5)*50, y:GROUND-115-Math.random()*35, life:2+Math.random()});
      cut.phase='pause'; cut.t=0;
    }
  } else if(cut.phase==='pause'){
    p.pose='idle';
    if(cut.t > 1.1){ cut.phase='kneel'; cut.t=0; beep(523, 0.3, 'sine', 0.08); }
  } else if(cut.phase==='kneel'){
    // Greg klęka i wyciąga pierścionek
    p.pose='kneel'; p.facing = Math.sign(girl.x - p.x || 1);
    if(Math.random() < 0.22)
      particles.push({x:p.x + p.facing*24, y:GROUND-54, vx:(Math.random()-0.5)*1.4, vy:-Math.random()*1.4, life:0.5, color:'#fff176'});
    if(cut.t > 2.6){
      cut.phase='yes'; cut.t=0;
      addPopup(girl.x, GROUND - 165, 'YES! 💍❤️', '#ff5fa2');
      sndWin(); spawnConfetti(90); camPunch = Math.max(camPunch, 0.06);
      for(let i=0;i<12;i++) hearts.push({x:(p.x+girl.x)/2 + (Math.random()-0.5)*90, y:GROUND-100-Math.random()*60, life:2+Math.random()*1.5});
    }
  } else if(cut.phase==='yes'){
    p.pose='kneel';
    if(Math.random() < 0.35) spawnConfetti(3);
    if(Math.random() < 0.12) hearts.push({x:(p.x+girl.x)/2 + (Math.random()-0.5)*100, y:GROUND-110, life:1.5+Math.random()});
    if(cut.t > 2.6){
      cut.phase='gosiaCome'; cut.t=0;
      gosia.shown = true; gosia.x = p.x - 500; gosia.pose='walk'; gosia.facing = 1;
      sndWhistle();
    }
  }
  // ===== FINAŁ: wchodzi MS GOSIA, kierowniczka basenu =====
  else if(cut.phase==='gosiaCome'){
    p.pose='idle';
    gosia.walkT += dt*9; gosia.pose='walk';
    gosia.x += 200*dt;
    p.facing = Math.sign(gosia.x - p.x || -1);
    if(cut.t > 0.9 && cut.t - dt <= 0.9) sndWhistle();
    if(gosia.x > p.x - 96){ gosia.x = p.x - 96; cut.phase='gosiaWarn'; cut.t=0; gosia.pose='point'; }
  } else if(cut.phase==='gosiaWarn'){
    gosia.pose='point'; gosia.facing = 1;
    p.pose='idle'; p.facing = -1;
    if(cut.t > 1.8){
      cut.phase='gosiaZap'; cut.t=0; gosia.pose='zap';
      cut.baseX = p.x;
      sndZap(); flashT = Math.max(flashT, 0.35); shake = Math.max(shake, 12);
    }
  } else if(cut.phase==='gosiaZap'){
    gosia.pose='zap'; gosia.zapT += dt;
    p.pose='zap';
    p.x = cut.baseX + (Math.random()-0.5)*4;      // szarpie nim prąd
    if(Math.random() < 0.55)
      particles.push({x:p.x + (Math.random()-0.5)*36, y:GROUND-40-Math.random()*70,
        vx:(Math.random()-0.5)*5, vy:-Math.random()*4, life:0.4, color: Math.random()<0.5 ? '#fff176' : '#9ad8ff'});
    if(cut.t > 0.25 && cut.t - dt <= 0.25) addPopup(p.x, GROUND-165, '⚡ ZAAAP! ⚡', '#fff176');
    if(Math.floor(cut.t*9) !== Math.floor((cut.t-dt)*9)) beep(1800+Math.random()*900, 0.05, 'square', 0.05, -600);
    if(cut.t > 1.7){
      cut.phase='gosiaKick'; cut.t=0; gosia.pose='kick'; gosia.kickT = 0;
      p.x = cut.baseX;
    }
  } else if(cut.phase==='gosiaKick'){
    gosia.pose='kick'; gosia.kickT += dt;
    p.pose='hit';
    if(cut.t > 0.24 && cut.t - dt <= 0.24){
      // kopniak roboczy pani Gosi — lot po łuku prosto do basenu
      sndKick(); shake = Math.max(shake, 14); hitStop = Math.max(hitStop, 0.1);
      burst(p.x - 20, GROUND-50, '#fff176', 16);
      addPopup(p.x, GROUND-180, '🦵 AND OUT! 🦵', '#c8ff5e');
      const dist = Math.max(80, (POOL.x + 60) - p.x);
      p.vy = -7.5; p.vx = Math.min(20, dist/38);
      p.onGround = false; p.rot = 0;
    }
    if(cut.t > 0.5 && !p.onGround){ cut.phase='gosiaFly'; cut.t=0; }
  } else if(cut.phase==='gosiaFly'){
    gosia.pose='idle';
    p.pose='hit';
    p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.rot += 0.3;
    p.x = Math.min(p.x, POOL.x + POOL.w - 70);
    if(p.y >= POOL.top + 30 && p.x > POOL.x){
      cut.phase='gosiaSunk'; cut.t=0; p.rot = 0; cut.inPool = true;
      sndSplash(); shake = Math.max(shake, 9);
      for(let i=0;i<30;i++) splashes.push({x:p.x, y:POOL.top, vx:(Math.random()-0.5)*8, vy:-Math.random()*9-2, life:0.95});
      p.y = POOL.top + 34;
    } else if(p.x <= POOL.x && p.y >= GROUND){ // nie doleciał nad wodę — odbicie po deskach
      p.y = GROUND; p.vy = -Math.abs(p.vy)*0.55; p.vx *= 0.92;
      if(Math.abs(p.vy) < 1.6){ cut.phase='end'; cut.t=0; p.rot = 0; p.pose='ko'; }
    }
  } else if(cut.phase==='gosiaSunk'){
    gosia.pose='idle'; gosia.facing = 1;
    p.y = POOL.top + 34 + Math.sin(time*2)*3;
    if(Math.random() < 0.08) hearts.push({x:girl.x + (Math.random()-0.5)*60, y:GROUND-120, life:1.4+Math.random()});
    if(cut.t > 1.8){ cut.phase='end'; cut.t=0; }
  } else { // 'end' — Greg moknie, Natalka ma pierścionek, pani Gosia ma spokój
    gosia.pose='idle';
    if(cut.inPool){ p.pose='ko'; p.y = POOL.top + 34 + Math.sin(time*2)*3; }
    else p.pose='ko';
    if(Math.random() < 0.25) spawnConfetti(2);
    if(Math.random() < 0.05) hearts.push({x:girl.x + (Math.random()-0.5)*70, y:GROUND-110, life:1.5+Math.random()});
  }
}

// ---------- drawing ----------
// pompon cheerleaderki — kłębek niebiesko-białych frędzli
function drawPompom(x, y, s, t){
  ctx.save(); ctx.translate(x, y);
  const n = 11;
  for(let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2 + Math.sin(t*6+i)*0.15;
    const len = (7+Math.sin(t*9+i*2)*1.6)*s;
    ctx.strokeStyle = i%2 ? '#eaf2ff' : '#2f74d8';
    ctx.lineWidth = 2.4*s; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*len, Math.sin(a)*len); ctx.stroke();
  }
  ctx.fillStyle='#ffd43b'; ctx.beginPath(); ctx.arc(0,0,2.4*s,0,Math.PI*2); ctx.fill(); // uchwyt
  ctx.restore();
}

// ===== OWCA / BARAN — pełne zwierzę (wrogowie) =====
function drawSheep(f, s, sh, hip, headY, headR, legF, legB, hurtFlash, limbCol){
  const big = f.isArek;
  const wool   = hurtFlash ? '#ffe0e0' : (big ? '#4a443e' : '#efe7d2');
  const woolSh = big ? 'rgba(0,0,0,0.32)' : 'rgba(110,100,78,0.3)';
  const dark   = big ? '#15110d' : '#352a20';
  const legCol = big ? '#15110d' : '#2c241d';
  const bw = (big?22:16.5)*s, bh = (big?15:11.5)*s, by = -(big?40:34)*s;
  const run = (f.pose==='charge'); const amp = run?4.5:2.2;
  // --- 4 krótkie nogi z kopytkami ---
  ctx.strokeStyle=legCol; ctx.lineWidth=(big?5.5:4.2)*s; ctx.lineCap='round';
  const legX=[-bw*0.62,-bw*0.22,bw*0.22,bw*0.62], legPh=[0,Math.PI,Math.PI*0.5,Math.PI*1.5];
  for(let i=0;i<4;i++){
    const sw=Math.sin(f.walkT+legPh[i])*amp*s;
    ctx.beginPath(); ctx.moveTo(legX[i], by+bh*0.55); ctx.lineTo(legX[i]+sw, -1*s); ctx.stroke();
    ctx.fillStyle=dark; ctx.beginPath(); ctx.ellipse(legX[i]+sw,-0.5*s,2.8*s,2*s,0,0,Math.PI*2); ctx.fill();
  }
  // ogonek
  ctx.fillStyle=wool; ctx.beginPath(); ctx.arc(-bw*0.98, by+1*s, 4.2*s, 0, Math.PI*2); ctx.fill();
  // --- wełniste ciało (miękkie, gradientowe 3D) ---
  ctx.fillStyle=woolSh; ctx.beginPath(); ctx.ellipse(1.5*s,by+2.5*s,bw,bh,0,0,Math.PI*2); ctx.fill();
  const woolHi = big ? '#5c564e' : '#fbf6ea', woolLo = big ? '#332e29' : '#d8cdb1';
  const bodyG = ctx.createRadialGradient(-bw*0.3, by-bh*0.4, bh*0.2, 0, by+bh*0.2, bw*1.2);
  bodyG.addColorStop(0, woolHi); bodyG.addColorStop(0.55, wool); bodyG.addColorStop(1, woolLo);
  ctx.fillStyle=bodyG; ctx.beginPath(); ctx.ellipse(0,by,bw,bh,0,0,Math.PI*2); ctx.fill();
  const N=10, br=(big?5.4:4.3)*s;
  for(let i=0;i<N;i++){ const a=i/N*Math.PI*2; const bx=Math.cos(a)*bw*0.74, byy=by+Math.sin(a)*bh*0.8;
    // kłębek z własnym łagodnym cieniowaniem
    const bg=ctx.createRadialGradient(bx-br*0.4,byy-br*0.5,0, bx,byy,br*1.15);
    bg.addColorStop(0, woolHi); bg.addColorStop(0.6, wool); bg.addColorStop(1, woolLo);
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(bx,byy,br,0,Math.PI*2); ctx.fill();
  }
  // --- GŁOWA z przodu (prawa strona = kierunek) ---
  const hx=bw*0.92, hy=by-bh*0.25, hr=headR*(big?1.05:0.95);
  // zakręcone rogi
  const hornCol=hurtFlash?'#f0ddb4':(big?'#6b5a3a':'#c7a86f'), hornDk=big?'#4a3d26':'#9c8352';
  function horn(dir){
    const cx0=hx+dir*hr*0.55, cy0=hy-hr*0.5;
    for(let pass=0;pass<2;pass++){
      ctx.strokeStyle=pass===0?hornDk:hornCol; ctx.lineWidth=(pass===0?5:3.6)*s; ctx.lineCap='round';
      ctx.beginPath();
      for(let t=0;t<=1.001;t+=0.09){ const ang=(dir>0?-0.4:Math.PI+0.4)+dir*t*5.0; const rad=(5.6-t*3.9)*s;
        const px=cx0+Math.cos(ang)*rad, py=cy0+Math.sin(ang)*rad+t*2.6*s; t===0?ctx.moveTo(px,py):ctx.lineTo(px,py); }
      ctx.stroke();
    }
  }
  horn(-1); horn(1);
  // uszy
  ctx.fillStyle=dark;
  ctx.beginPath(); ctx.ellipse(hx-hr*0.5,hy+hr*0.2,3.8*s,1.9*s,-0.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx+hr*0.5,hy+hr*0.2,3.8*s,1.9*s,0.5,0,Math.PI*2); ctx.fill();
  // ciemny pysk-twarz (gradient dla objętości)
  const faceG=ctx.createRadialGradient(hx-hr*0.3,hy-hr*0.4,hr*0.1, hx,hy,hr*1.1);
  faceG.addColorStop(0, big?'#2a221c':'#4a3c30'); faceG.addColorStop(1, dark);
  ctx.fillStyle=faceG; ctx.beginPath(); ctx.ellipse(hx,hy,hr*0.86,hr*1.02,0,0,Math.PI*2); ctx.fill();
  // wełna na czole
  ctx.fillStyle=wool; for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(hx+i*3*s,hy-hr*0.85,3*s,0,Math.PI*2); ctx.fill(); }
  // jasny pysk + nozdrza
  ctx.fillStyle=big?'#241d19':'#d8cdb8'; ctx.beginPath(); ctx.ellipse(hx+hr*0.42,hy+hr*0.42,hr*0.6,hr*0.46,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#120e0b'; ctx.beginPath(); ctx.ellipse(hx+hr*0.2,hy+hr*0.35,0.9*s,1.2*s,0,0,6.3); ctx.ellipse(hx+hr*0.62,hy+hr*0.35,0.9*s,1.2*s,0,0,6.3); ctx.fill();
  // oczy (wściekłe)
  if(big){ ctx.shadowColor='#ff0000'; ctx.shadowBlur=8; }
  ctx.fillStyle=big?'#ff2020':'#ffdd33';
  ctx.beginPath(); ctx.arc(hx-1*s,hy-1*s,(big?2.2:1.7)*s,0,Math.PI*2); ctx.arc(hx+4*s,hy-1*s,(big?2.2:1.7)*s,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=hornDk; ctx.lineWidth=1.6*s; // brwi
